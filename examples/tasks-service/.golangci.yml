run:
  timeout: 3m
  tests: true

linters:
  enable:
    - depguard
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt

# --8<-- [start:depguard_config]
linters-settings:
  depguard:
    rules:
      domain_isolation:
        list-mode: strict
        files:
          - "!**/*_test.go"
          - "**/internal/domain/**"
        allow:
          - "$gostd"
      usecase_isolation:
        list-mode: strict
        files:
          - "!**/*_test.go"
          - "**/internal/usecase/**"
        allow:
          - "$gostd"
          - "github.com/orbit-polytech/orbit-docs/examples/tasks-service/internal/domain"
# --8<-- [end:depguard_config]
