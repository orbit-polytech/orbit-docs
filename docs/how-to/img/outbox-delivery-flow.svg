<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 680" width="100%" height="100%">
  <defs>
    <linearGradient id="outboxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>

    <filter id="shadowBox" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="1056" height="676" rx="16" fill="url(#outboxBg)" stroke="#313244" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="10" cy="10" r="6" fill="#f59e0b" />
    <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#cdd6f4">
      RabbitMQ &amp; Outbox • Гарантированная доставка событий и идемпотентный потребитель
    </text>
    <line x1="0" y1="28" x2="996" y2="28" stroke="#313244" stroke-width="1" />
  </g>

  <!-- Lifelines -->
  <line x1="90" y1="110" x2="90" y2="640" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="260" y1="110" x2="260" y2="640" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="430" y1="110" x2="430" y2="640" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="600" y1="110" x2="600" y2="640" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="780" y1="110" x2="780" y2="640" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="960" y1="110" x2="960" y2="640" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Participants -->
  <g transform="translate(15, 68)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="150" height="42" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="75" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#93c5fd">👤 Gateway / Client</text>
    <text x="75" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">Внешний вызов</text>
  </g>

  <g transform="translate(190, 68)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="140" height="42" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="70" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#a7f3d0">⚙️ tasks-service</text>
    <text x="70" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6ee7b7">Go-сервис</text>
  </g>

  <g transform="translate(360, 68)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="140" height="42" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.5" />
    <text x="70" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#bbf7d0">🐘 PostgreSQL</text>
    <text x="70" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#86efac">tasks_db</text>
  </g>

  <g transform="translate(530, 68)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="140" height="42" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="70" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#c4b5fd">🔄 Outbox Relay</text>
    <text x="70" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a5b4fc">Background Worker</text>
  </g>

  <g transform="translate(710, 68)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="140" height="42" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="1.5" />
    <text x="70" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#fde68a">🐇 RabbitMQ</text>
    <text x="70" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fcd34d">Exchange: events</text>
  </g>

  <g transform="translate(885, 68)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="150" height="42" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <text x="75" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#67e8f9">🔔 notif-service</text>
    <text x="75" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#22d3ee">Idempotent Consumer</text>
  </g>

  <!-- Flow Phase 1: Local DB Transaction -->
  <!-- Client -> tasks-service -->
  <line x1="90" y1="140" x2="254" y2="140" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrCyan)" />
  <rect x="100" y="125" width="140" height="15" rx="3" fill="#0f172a" />
  <text x="105" y="136" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#67e8f9">1. gRPC CreateTask</text>

  <!-- Transaction box -->
  <g transform="translate(240, 160)">
    <rect x="0" y="0" width="210" height="75" rx="8" fill="#022c22" stroke="#10b981" stroke-width="1.2" stroke-dasharray="4 3" />
    <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#6ee7b7">ЛОКАЛЬНАЯ ACID-ТРАНЗАКЦИЯ</text>
    <text x="10" y="38" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#a7f3d0">• INSERT INTO tasks (...)</text>
    <text x="10" y="56" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#a7f3d0">• INSERT INTO outbox_events (...)</text>
    <text x="10" y="70" font-family="'JetBrains Mono', monospace" font-size="8" fill="#34d399">COMMIT TRANSACTION</text>
  </g>

  <!-- DB Commit & Ack to Client -->
  <line x1="254" y1="255" x2="96" y2="255" stroke="#10b981" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrEmerald)" />
  <rect x="115" y="243" width="120" height="15" rx="3" fill="#0f172a" />
  <text x="120" y="254" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#86efac">200 OK (Task created)</text>

  <!-- Flow Phase 2: Relay Worker Loop -->
  <g transform="translate(360, 280)">
    <rect x="0" y="0" width="450" height="135" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.2" />
    <rect x="12" y="8" width="220" height="20" rx="4" fill="#312e81" />
    <text x="20" y="22" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#c4b5fd">
      ФОНОВЫЙ ЦИКЛ RELAY (SKIP LOCKED)
    </text>

    <!-- 1. Fetch -->
    <text x="20" y="48" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#e0e7ff">1. SELECT * FROM outbox_events WHERE processed_at IS NULL</text>
    <!-- 2. Publish -->
    <text x="20" y="75" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#fcd34d">2. BasicPublish(Exchange="tasks.events", RoutingKey="task.created")</text>
    <!-- 3. Mark Done -->
    <text x="20" y="105" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#86efac">3. UPDATE outbox_events SET processed_at = NOW()</text>
    <text x="20" y="125" font-family="'Segoe UI', sans-serif" font-size="8" fill="#94a3b8">При сбое воркера транзакция откатится, событие не потеряется</text>
  </g>

  <!-- Lines from worker to DB and RMQ -->
  <line x1="600" y1="330" x2="436" y2="330" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arrPurple)" />
  <line x1="600" y1="360" x2="774" y2="360" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrAmber)" />

  <!-- Flow Phase 3: Consumer Idempotency -->
  <!-- RMQ -> Consumer -->
  <line x1="780" y1="445" x2="954" y2="445" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrAmber)" />
  <rect x="800" y="432" width="135" height="15" rx="3" fill="#0f172a" />
  <text x="805" y="443" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#fcd34d">BasicConsume(event)</text>

  <!-- Consumer Idempotent Processing Box -->
  <g transform="translate(820, 470)">
    <rect x="0" y="0" width="220" height="175" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2" />
    <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#67e8f9">
      ПРОВЕРКА ИДЕМПОТЕНТНОСТИ
    </text>

    <!-- Diamond condition -->
    <polygon points="110,32 170,55 110,78 50,55" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
    <text x="110" y="58" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#fde68a">Есть key в Redis?</text>

    <!-- Branch YES: Duplicate -->
    <text x="18" y="100" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#ef4444">[ДА - Дубликат]</text>
    <text x="18" y="114" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">msg.Ack(false) (пропуск)</text>

    <!-- Branch NO: New -->
    <text x="18" y="135" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#10b981">[НЕТ - Новое]</text>
    <text x="18" y="148" font-family="'JetBrains Mono', monospace" font-size="8" fill="#86efac">1. Send Telegram/Push</text>
    <text x="18" y="160" font-family="'JetBrains Mono', monospace" font-size="8" fill="#86efac">2. Store key &amp; msg.Ack()</text>
  </g>
</svg>
