<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="stepShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrStep" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="1016" height="216" rx="14" fill="url(#flowBg)" stroke="#313244" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(24, 22)">
    <circle cx="8" cy="8" r="5" fill="#38bdf8" />
    <text x="20" y="12" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#cdd6f4">
      Порядок добавления нового gRPC-метода (Contract-First Flow)
    </text>
    <line x1="0" y1="22" x2="970" y2="22" stroke="#313244" stroke-width="1" />
  </g>

  <!-- ==================== 6 STEPS ==================== -->

  <!-- Step 1 -->
  <g transform="translate(25, 65)" filter="url(#stepShadow)">
    <rect x="0" y="0" width="135" height="125" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="20" cy="22" r="10" fill="#1e3a8a" />
    <text x="20" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#93c5fd">1</text>
    <text x="36" y="26" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#93c5fd">contracts</text>
    <line x1="10" y1="40" x2="125" y2="40" stroke="#334155" stroke-width="1" />
    <text x="10" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">.proto файл</text>
    <text x="10" y="74" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Описать rpc</text>
    <text x="10" y="90" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Request / Response</text>
    <text x="10" y="112" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">Google AIP стиль</text>
  </g>

  <line x1="160" y1="127" x2="185" y2="127" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrStep)" />

  <!-- Step 2 -->
  <g transform="translate(190, 65)" filter="url(#stepShadow)">
    <rect x="0" y="0" width="135" height="125" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="20" cy="22" r="10" fill="#312e81" />
    <text x="20" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#c7d2fe">2</text>
    <text x="36" y="26" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#c7d2fe">Buf CLI</text>
    <line x1="10" y1="40" x2="125" y2="40" stroke="#334155" stroke-width="1" />
    <text x="10" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a5b4fc">buf lint</text>
    <text x="10" y="74" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Синтаксис схем</text>
    <text x="10" y="90" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a5b4fc">buf breaking</text>
    <text x="10" y="112" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#64748b">--against main</text>
  </g>

  <line x1="325" y1="127" x2="350" y2="127" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrStep)" />

  <!-- Step 3 -->
  <g transform="translate(355, 65)" filter="url(#stepShadow)">
    <rect x="0" y="0" width="135" height="125" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" />
    <circle cx="20" cy="22" r="10" fill="#082f49" />
    <text x="20" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#7dd3fc">3</text>
    <text x="36" y="26" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#7dd3fc">Generate</text>
    <line x1="10" y1="40" x2="125" y2="40" stroke="#334155" stroke-width="1" />
    <text x="10" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">buf generate</text>
    <text x="10" y="74" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Сборка gen/go</text>
    <text x="10" y="90" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Сборка gen/py</text>
    <text x="10" y="112" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#64748b">OpenAPI спека</text>
  </g>

  <line x1="490" y1="127" x2="515" y2="127" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrStep)" />

  <!-- Step 4 -->
  <g transform="translate(520, 65)" filter="url(#stepShadow)">
    <rect x="0" y="0" width="135" height="125" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="20" cy="22" r="10" fill="#164e63" />
    <text x="20" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#a5f3fc">4</text>
    <text x="36" y="26" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#a5f3fc">Подключение</text>
    <line x1="10" y1="40" x2="125" y2="40" stroke="#334155" stroke-width="1" />
    <text x="10" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#22d3ee">go get</text>
    <text x="10" y="74" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Обновление стабов</text>
    <text x="10" y="90" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">в микросервисе</text>
    <text x="10" y="112" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">go.mod зависимость</text>
  </g>

  <line x1="655" y1="127" x2="680" y2="127" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrStep)" />

  <!-- Step 5 -->
  <g transform="translate(685, 65)" filter="url(#stepShadow)">
    <rect x="0" y="0" width="145" height="125" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="20" cy="22" r="10" fill="#78350f" />
    <text x="20" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fde68a">5</text>
    <text x="36" y="26" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#fde68a">Бизнес-логика</text>
    <line x1="10" y1="40" x2="135" y2="40" stroke="#334155" stroke-width="1" />
    <text x="10" y="58" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Слой Domain</text>
    <text x="10" y="74" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Слой Usecase</text>
    <text x="10" y="90" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Интерфейсы портов</text>
    <text x="10" y="112" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#86efac">Покрытие тестами</text>
  </g>

  <line x1="830" y1="127" x2="855" y2="127" stroke="#10b981" stroke-width="2" marker-end="url(#arrStep)" />

  <!-- Step 6 -->
  <g transform="translate(860, 65)" filter="url(#stepShadow)">
    <rect x="0" y="0" width="135" height="125" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="2" />
    <circle cx="20" cy="22" r="10" fill="#166534" />
    <text x="20" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#bbf7d0">6</text>
    <text x="36" y="26" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#86efac">gRPC Handler</text>
    <line x1="10" y1="40" x2="125" y2="40" stroke="#166534" stroke-width="1" />
    <text x="10" y="58" font-family="'Segoe UI', sans-serif" font-size="10" fill="#bbf7d0">Реализация RPC</text>
    <text x="10" y="74" font-family="'Segoe UI', sans-serif" font-size="10" fill="#bbf7d0">Маппинг DTO</text>
    <text x="10" y="90" font-family="'Segoe UI', sans-serif" font-size="10" fill="#bbf7d0">Обработка ошибок</text>
    <text x="10" y="112" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#86efac">Готово к тестам!</text>
  </g>
</svg>
