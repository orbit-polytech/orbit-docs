<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="100%" height="100%">
  <defs>
    <linearGradient id="blocBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>

    <filter id="shadowBox" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="976" height="436" rx="16" fill="url(#blocBg)" stroke="#313244" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="10" cy="10" r="6" fill="#38bdf8" />
    <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#cdd6f4">
      Flutter &amp; BLoC • Однонаправленный поток данных (Unidirectional Data Flow)
    </text>
    <line x1="0" y1="28" x2="916" y2="28" stroke="#313244" stroke-width="1" />
  </g>

  <!-- ==================== BLOCKS ==================== -->

  <!-- Block 1: UI Widget (Left) -->
  <g transform="translate(40, 100)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="250" height="260" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    
    <!-- Title -->
    <rect x="12" y="12" width="226" height="32" rx="6" fill="#1e3a8a" />
    <text x="125" y="32" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#93c5fd">
      📱 UI: Presentation Layer
    </text>

    <!-- Details -->
    <text x="20" y="70" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f1f5f9">TasksScreen (Widget)</text>
    <text x="20" y="90" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8">• Чистая декларативная вёрстка</text>
    <text x="20" y="110" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8">• Не содержит бизнес-логики</text>

    <!-- Listeners -->
    <rect x="16" y="130" width="218" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="26" y="150" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">BlocBuilder&lt;TasksBloc, State&gt;</text>
    <text x="26" y="168" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">Реактивный перерендер экрана</text>

    <rect x="16" y="192" width="218" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="26" y="212" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f59e0b">context.read().add(Event)</text>
    <text x="26" y="230" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">Диспетчеризация намерений</text>
  </g>

  <!-- Block 2: BLoC (Center) -->
  <g transform="translate(365, 100)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="260" height="260" rx="12" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2" />
    
    <!-- Title -->
    <rect x="12" y="12" width="236" height="32" rx="6" fill="#312e81" />
    <text x="130" y="32" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#c4b5fd">
      ⚙️ Business Logic: TasksBloc
    </text>

    <!-- Event Handlers -->
    <rect x="16" y="60" width="228" height="56" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
    <text x="24" y="80" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#a5b4fc">on&lt;LoadTasksEvent&gt;</text>
    <text x="24" y="96" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">emit(TasksLoadingState)</text>
    <text x="24" y="108" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">await repo.getTasks()</text>

    <!-- State Emission -->
    <rect x="16" y="126" width="228" height="56" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="24" y="146" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#6ee7b7">on&lt;CompleteTaskEvent&gt;</text>
    <text x="24" y="162" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">await repo.complete(id)</text>
    <text x="24" y="174" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">emit(TasksLoadedState)</text>

    <!-- Transformer / Debounce -->
    <rect x="16" y="192" width="228" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="24" y="212" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#fcd34d">Event Transformer</text>
    <text x="24" y="228" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">Дебаунс поиска 300мс &amp; droppable()</text>
  </g>

  <!-- Block 3: Data / Repository (Right) -->
  <g transform="translate(695, 100)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="245" height="260" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    
    <!-- Title -->
    <rect x="12" y="12" width="221" height="32" rx="6" fill="#022c22" />
    <text x="122" y="32" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">
      📦 Data Layer: Repository
    </text>

    <!-- Details -->
    <text x="18" y="70" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f1f5f9">TasksRepository</text>
    <text x="18" y="90" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8">• Изоляция внешних источников</text>

    <!-- Data sources -->
    <rect x="14" y="110" width="217" height="60" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="22" y="130" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34d399">GatewayClient (REST/gRPC)</text>
    <text x="22" y="146" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#6ee7b7">POST /api/v1/tasks</text>
    <text x="22" y="158" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">Сетевые запросы через HTTP</text>

    <!-- Local storage -->
    <rect x="14" y="180" width="217" height="64" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="22" y="200" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">LocalDb (Drift / Hive)</text>
    <text x="22" y="216" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">Офлайн-кэш задач на устройстве</text>
  </g>

  <!-- ==================== FLOW ARROWS ==================== -->

  <!-- Top Arrow: UI -> BLoC (Event) -->
  <path d="M 290 150 L 357 150" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrAmber)" />
  <rect x="296" y="130" width="60" height="16" rx="3" fill="#181825" stroke="#f59e0b" stroke-width="1" />
  <text x="326" y="142" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#fde68a">1. EVENT</text>

  <!-- Top Arrow: BLoC -> Repo (Invoke) -->
  <path d="M 625 150 L 687 150" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrBlue)" />
  <rect x="632" y="130" width="56" height="16" rx="3" fill="#181825" stroke="#3b82f6" stroke-width="1" />
  <text x="660" y="142" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#93c5fd">2. CALL</text>

  <!-- Bottom Arrow: Repo -> BLoC (Result / Error) -->
  <path d="M 695 300 L 633 300" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrEmerald)" />
  <rect x="635" y="282" width="54" height="16" rx="3" fill="#181825" stroke="#10b981" stroke-width="1" />
  <text x="662" y="294" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#86efac">3. DATA</text>

  <!-- Bottom Arrow: BLoC -> UI (State) -->
  <path d="M 365 300 L 298 300" fill="none" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrPurple)" />
  <rect x="300" y="282" width="60" height="16" rx="3" fill="#181825" stroke="#8b5cf6" stroke-width="1" />
  <text x="330" y="294" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#c4b5fd">4. STATE</text>

  <!-- Cycle badge -->
  <g transform="translate(370, 385)">
    <rect x="0" y="0" width="240" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="12" r="5" fill="#10b981" />
    <text x="30" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#94a3b8">
      ♻️ Изолированный цикл состояний
    </text>
  </g>
</svg>
