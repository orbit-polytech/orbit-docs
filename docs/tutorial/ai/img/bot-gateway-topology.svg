<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 440" width="100%" height="100%">
  <defs>
    <linearGradient id="botBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>

    <filter id="shadowBox" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="1016" height="436" rx="16" fill="url(#botBg)" stroke="#313244" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="10" cy="10" r="6" fill="#0ea5e9" />
    <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#cdd6f4">
      bot-service • Топология взаимодействия Telegram-бота и бэкенда через API Gateway
    </text>
    <line x1="0" y1="28" x2="956" y2="28" stroke="#313244" stroke-width="1" />
  </g>

  <!-- Node 1: Telegram User -->
  <g transform="translate(30, 110)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="160" height="240" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8" />
    <rect x="12" y="12" width="136" height="28" rx="6" fill="#0284c7" />
    <text x="80" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff">
      ✈️ Telegram
    </text>

    <g transform="translate(14, 60)">
      <circle cx="20" cy="20" r="14" fill="#0284c7" />
      <text x="20" y="24" text-anchor="middle" font-size="14">🎓</text>
      <text x="44" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Студент</text>
      <text x="44" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Московский Политех</text>
    </g>

    <rect x="14" y="120" width="132" height="100" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="22" y="140" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#e0f2fe">«Когда сессия?»</text>
    <text x="22" y="160" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#e0f2fe">«Где аудитория БС-302?»</text>
    <text x="22" y="180" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#e0f2fe">«Мои дедлайны лаб»</text>
    <text x="22" y="205" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#38bdf8">HTTPS Webhook / Poll</text>
  </g>

  <!-- Arrow User -> Bot -->
  <line x1="190" y1="210" x2="230" y2="210" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrCyan)" />

  <!-- Node 2: bot-service Container -->
  <g transform="translate(235, 90)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="300" height="280" rx="12" fill="#1e1b4b" stroke="#0ea5e9" stroke-width="1.8" />
    
    <!-- Header -->
    <rect x="14" y="12" width="272" height="28" rx="6" fill="#0369a1" />
    <text x="150" y="30" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff">
      🤖 bot-service (Python 3.12)
    </text>
    <text x="150" y="55" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#7dd3fc">
      Внешний клиент • aiogram 3.x
    </text>

    <!-- Submodule 1: Router / Handlers -->
    <rect x="16" y="70" width="268" height="75" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
    <text x="26" y="90" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8">aiogram Router &amp; Handlers</text>
    <text x="26" y="106" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">• Валидация команд и стейт FSM</text>
    <text x="26" y="122" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">• Проверка Telegram Auth Token</text>
    <text x="26" y="136" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#7dd3fc">@ai_router.message(Command(...))</text>

    <!-- Internal Arrow -->
    <line x1="150" y1="145" x2="150" y2="168" stroke="#0ea5e9" stroke-width="1.8" marker-end="url(#arrCyan)" />

    <!-- Submodule 2: HTTP Client Pool -->
    <rect x="16" y="170" width="268" height="75" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1" />
    <text x="26" y="190" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#60a5fa">ApiGatewayClient (httpx)</text>
    <text x="26" y="206" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">• Единый пул httpx.AsyncClient</text>
    <text x="26" y="222" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">• Автоматический ретрай и таймаут 5с</text>
    <text x="26" y="236" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#93c5fd">Header: Authorization: Bearer JWT</text>

    <!-- Isolation Warning -->
    <text x="150" y="265" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#ef4444">
      🚫 ПРЯМОЙ ДОСТУП К gRPC / DB ЗАПРЕЩЕН
    </text>
  </g>

  <!-- Arrow Bot -> Gateway -->
  <line x1="535" y1="230" x2="575" y2="230" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrCyan)" />
  <rect x="526" y="200" width="60" height="22" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="556" y="214" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#7dd3fc">REST/JSON</text>

  <!-- Node 3: API Gateway -->
  <g transform="translate(580, 110)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="180" height="240" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.8" />
    <rect x="12" y="12" width="156" height="28" rx="6" fill="#312e81" />
    <text x="90" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#c7d2fe">
      🛡️ API Gateway
    </text>
    <text x="90" y="55" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a5b4fc">
      :8080 (Go Chi)
    </text>

    <rect x="14" y="70" width="152" height="150" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
    <text x="22" y="90" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#e0e7ff">Функции шлюза:</text>
    <text x="22" y="110" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">1. CORS &amp; Rate Limit</text>
    <text x="22" y="130" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">2. Ed25519 JWT вал.</text>
    <text x="22" y="150" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">3. Извлечение claims</text>
    <text x="22" y="170" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">4. Внедрение x-user-id</text>
    <text x="22" y="190" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">5. Трансляция ошибок</text>
    <text x="22" y="210" font-family="'JetBrains Mono', monospace" font-size="8" fill="#818cf8">gRPC multiplexing</text>
  </g>

  <!-- Arrow Gateway -> Internal Services -->
  <line x1="760" y1="230" x2="800" y2="230" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrPurple)" />
  <rect x="750" y="200" width="60" height="22" rx="3" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
  <text x="780" y="214" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#c4b5fd">gRPC HTTP/2</text>

  <!-- Node 4: Internal Services -->
  <g transform="translate(805, 110)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="185" height="240" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1.8" />
    <rect x="12" y="12" width="161" height="28" rx="6" fill="#022c22" />
    <text x="92" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">
      🔒 Внутренний контур
    </text>
    <text x="92" y="55" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6ee7b7">
      orbit-net (Изолирован)
    </text>

    <!-- Services inside -->
    <rect x="14" y="70" width="157" height="46" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="22" y="90" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#6ee7b7">ai-service</text>
    <text x="22" y="104" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">RAG &amp; Gemini (:50057)</text>

    <rect x="14" y="124" width="157" height="46" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="22" y="144" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#6ee7b7">schedule-service</text>
    <text x="22" y="158" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">Расписание пар (:50053)</text>

    <rect x="14" y="178" width="157" height="46" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="22" y="198" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#6ee7b7">tasks-service</text>
    <text x="22" y="212" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">Учебные задачи (:50055)</text>
  </g>
</svg>
