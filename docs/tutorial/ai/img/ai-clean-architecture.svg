<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%">
  <defs>
    <linearGradient id="aiCaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>

    <filter id="shadowBox" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="1016" height="536" rx="16" fill="url(#aiCaBg)" stroke="#313244" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="10" cy="10" r="6" fill="#8b5cf6" />
    <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#cdd6f4">
      ai-service • Архитектура Clean Architecture в Python (grpcio, pgvector, Gemini)
    </text>
    <line x1="0" y1="28" x2="956" y2="28" stroke="#313244" stroke-width="1" />
  </g>

  <!-- ==================== 4 COLUMNS / LAYERS ==================== -->

  <!-- Layer 1: Transport (Left) -->
  <g transform="translate(30, 80)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="220" height="420" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.8" />
    <rect x="12" y="12" width="196" height="28" rx="6" fill="#312e81" />
    <text x="110" y="30" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#c7d2fe">
      1. ТРАНСПОРТ
    </text>
    <text x="110" y="55" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#818cf8">
      interfaces/grpc/
    </text>

    <!-- Node 1: Servicer -->
    <rect x="14" y="70" width="192" height="68" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
    <text x="22" y="90" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#a5b4fc">RagGrpcServicer</text>
    <text x="22" y="106" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">Наследует сгенерированный</text>
    <text x="22" y="120" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">RagServiceServicer (buf)</text>

    <!-- Down arrow -->
    <line x1="110" y1="138" x2="110" y2="158" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrPurple)" />

    <!-- Node 2: Metadata Extractor -->
    <rect x="14" y="160" width="192" height="68" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
    <text x="22" y="180" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#a5b4fc">Context Extractor</text>
    <text x="22" y="196" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">Извлечение x-user-id</text>
    <text x="22" y="210" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">из gRPC-метаданных</text>

    <!-- Down arrow -->
    <line x1="110" y1="228" x2="110" y2="248" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrPurple)" />

    <!-- Node 3: Mappers -->
    <rect x="14" y="250" width="192" height="68" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
    <text x="22" y="270" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#a5b4fc">Data Mappers</text>
    <text x="22" y="286" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">Конвертация Protobuf DTO</text>
    <text x="22" y="300" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">&lt;-&gt; Domain QueryInput</text>

    <!-- Bottom isolation note -->
    <rect x="14" y="350" width="192" height="50" rx="6" fill="#020617" stroke="#475569" stroke-width="1" />
    <text x="22" y="368" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#ef4444">⚠️ ИЗОЛЯЦИЯ PROTOBUF</text>
    <text x="22" y="384" font-family="'Segoe UI', sans-serif" font-size="8" fill="#94a3b8">Стабы buf не проникают в ядро</text>
  </g>

  <!-- Arrow Transport -> UseCase -->
  <line x1="250" y1="284" x2="278" y2="284" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrPurple)" />

  <!-- Layer 2: Application / Use Cases -->
  <g transform="translate(280, 80)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="220" height="420" rx="12" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1.8" />
    <rect x="12" y="12" width="196" height="28" rx="6" fill="#075985" />
    <text x="110" y="30" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#bae6fd">
      2. СЦЕНАРИИ
    </text>
    <text x="110" y="55" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#7dd3fc">
      usecases/
    </text>

    <!-- Node: RagSearchUseCase -->
    <rect x="14" y="80" width="192" height="200" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
    <text x="22" y="104" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#38bdf8">RagSearchUseCase</text>
    <text x="22" y="124" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#e0f2fe">Оркестрация пайплайна:</text>
    <text x="22" y="145" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">1. Эмбеддинг вопроса</text>
    <text x="22" y="165" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">2. HNSW-поиск чанков в БД</text>
    <text x="22" y="185" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">3. Фильтрация релевантности</text>
    <text x="22" y="205" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">4. Формирование промпта</text>
    <text x="22" y="225" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">5. Генерация через Gemini</text>
    <text x="22" y="255" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#38bdf8">Зависит только от интерфейсов</text>

    <!-- Ports defined -->
    <rect x="14" y="310" width="192" height="90" rx="6" fill="#020617" stroke="#0284c7" stroke-width="1" />
    <text x="22" y="330" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#7dd3fc">Порты (Protocols):</text>
    <text x="22" y="348" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#38bdf8">• VectorRepository</text>
    <text x="22" y="366" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#38bdf8">• LlmClient</text>
    <text x="22" y="384" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#38bdf8">• Embedder</text>
  </g>

  <!-- Arrow UseCase -> Domain -->
  <line x1="500" y1="180" x2="528" y2="180" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrAmber)" />

  <!-- Layer 3: Domain Core (Top Right) -->
  <g transform="translate(530, 80)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="210" height="200" rx="12" fill="#78350f" stroke="#f59e0b" stroke-width="1.8" />
    <rect x="12" y="12" width="186" height="28" rx="6" fill="#451a03" />
    <text x="105" y="30" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fde68a">
      3. ДОМЕННОЕ ЯДРО
    </text>
    <text x="105" y="55" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#fcd34d">
      domain/
    </text>

    <rect x="14" y="70" width="182" height="110" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
    <text x="22" y="90" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#fde68a">Чистые @dataclass:</text>
    <text x="22" y="110" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fef08a">• QueryInput</text>
    <text x="22" y="126" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fef08a">• RetrievedChunk</text>
    <text x="22" y="142" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fef08a">• Document</text>
    <text x="22" y="158" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fef08a">• RagAnswer</text>
    <text x="22" y="172" font-family="'Segoe UI', sans-serif" font-size="8" fill="#94a3b8">Без сторонних зависимостей</text>
  </g>

  <!-- Arrow UseCase -> Infrastructure -->
  <line x1="500" y1="360" x2="528" y2="360" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrEmerald)" />

  <!-- Layer 4: Infrastructure (Bottom Right / Far Right) -->
  <g transform="translate(530, 300)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="460" height="200" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1.8" />
    <rect x="12" y="12" width="436" height="28" rx="6" fill="#022c22" />
    <text x="230" y="30" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#a7f3d0">
      4. ИНФРАСТРУКТУРНЫЕ АДАПТЕРЫ (infrastructure/)
    </text>

    <!-- Infra 1: PostgreSQL pgvector -->
    <g transform="translate(14, 52)">
      <rect x="0" y="0" width="205" height="130" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="12" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#6ee7b7">PostgresVectorRepo</text>
      <text x="12" y="44" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">• psycopg v3 + pgvector</text>
      <text x="12" y="60" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">• HNSW косинусный поиск</text>
      <text x="12" y="76" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#34d399">SELECT chunk, 1 - (vec &lt;=&gt; q)</text>
      <text x="12" y="92" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#34d399">ORDER BY vec &lt;=&gt; q LIMIT 5</text>
      <text x="12" y="114" font-family="'Segoe UI', sans-serif" font-size="8" fill="#64748b">Реализует VectorRepository</text>
    </g>

    <!-- Infra 2: Google Gemini Gateway -->
    <g transform="translate(235, 52)">
      <rect x="0" y="0" width="205" height="130" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1" />
      <text x="12" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#93c5fd">GeminiGateway</text>
      <text x="12" y="44" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">• google-genai SDK</text>
      <text x="12" y="60" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#60a5fa">text-embedding-004 (768d)</text>
      <text x="12" y="76" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#60a5fa">gemini-2.5-flash</text>
      <text x="12" y="96" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">• Retry c экспоненц. backoff</text>
      <text x="12" y="114" font-family="'Segoe UI', sans-serif" font-size="8" fill="#64748b">Реализует LlmClient / Embedder</text>
    </g>
  </g>
</svg>
