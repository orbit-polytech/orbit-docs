<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ragBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Stage Gradients -->
    <linearGradient id="st1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="st2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="st3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.8" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="ragShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Markers -->
    <marker id="arrRagBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrRagGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrRagPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="1056" height="596" rx="16" fill="url(#ragBg)" stroke="#313244" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="10" cy="10" r="6" fill="#a855f7" />
    <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#cdd6f4">
      RAG Пайплайн • Retrieval-Augmented Generation по базе регламентов Политеха
    </text>
    <line x1="0" y1="28" x2="996" y2="28" stroke="#313244" stroke-width="1" />
  </g>

  <!-- ==================== USER QUESTION BAR ==================== -->
  <g transform="translate(35, 75)" filter="url(#ragShadow)">
    <rect x="0" y="0" width="990" height="52" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="20" y="24" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#93c5fd">👤 Студент (Telegram / Мобилка):</text>
    <text x="260" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f1f5f9">«Сколько баллов нужно для допуска к экзамену по матанализу?»</text>
    <text x="20" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Входящий путь: Client ──&gt; gateway-service (:8080) ──&gt; gRPC RagService.AskQuestion(query) ──&gt; ai-service (:50057)</text>
  </g>

  <!-- Arrow down from Question to Stage 1 -->
  <line x1="530" y1="127" x2="530" y2="155" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrRagBlue)" />

  <!-- ==================== 3 STAGES OF RAG ==================== -->

  <!-- STAGE 1: Embeddings Vectorization -->
  <g transform="translate(35, 160)" filter="url(#ragShadow)">
    <rect x="0" y="0" width="310" height="310" rx="12" fill="url(#st1Grad)" stroke="#3b82f6" stroke-width="1.5" />
    
    <!-- Stage Badge -->
    <rect x="14" y="-12" width="220" height="22" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" />
    <text x="22" y="3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#93c5fd">
      ЭТАП 1: ВЕКТОРИЗАЦИЯ
    </text>

    <g transform="translate(15, 20)">
      <rect x="0" y="0" width="280" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <text x="12" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#93c5fd">Gemini text-embedding-004</text>
      <text x="12" y="42" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">task_type: RETRIEVAL_QUERY</text>
      <text x="12" y="60" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">Преобразование текста вопроса в плотный вектор</text>

      <!-- Vector Visual Box -->
      <g transform="translate(0, 95)">
        <rect x="0" y="0" width="280" height="85" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
        <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#38bdf8">Вектор эмбеддинга:</text>
        <rect x="12" y="32" width="256" height="28" rx="4" fill="#1e293b" />
        <text x="20" y="50" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a5f3fc">[0.024, -0.071, ..., 0.158]</text>
        <text x="12" y="74" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Размерность: 768 float чисел</text>
      </g>

      <text x="4" y="210" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">
        Смысловое представление запроса для математического поиска расстояния
      </text>
    </g>
  </g>

  <!-- Arrow Stage 1 -> Stage 2 -->
  <line x1="345" y1="315" x2="375" y2="315" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrRagBlue)" />

  <!-- STAGE 2: pgvector HNSW Search -->
  <g transform="translate(375, 160)" filter="url(#ragShadow)">
    <rect x="0" y="0" width="310" height="310" rx="12" fill="url(#st2Grad)" stroke="#10b981" stroke-width="1.5" />
    
    <!-- Stage Badge -->
    <rect x="14" y="-12" width="220" height="22" rx="4" fill="#022c22" stroke="#10b981" stroke-width="1" />
    <text x="22" y="3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#6ee7b7">
      ЭТАП 2: HNSW ПОИСК
    </text>

    <g transform="translate(15, 20)">
      <rect x="0" y="0" width="280" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" />
      <text x="12" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#6ee7b7">PostgreSQL 16 + pgvector</text>
      <text x="12" y="42" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">Косинусное расстояние: &lt;=&gt;</text>
      <text x="12" y="60" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">Индекс HNSW (Hierarchical Navigable Small World)</text>

      <!-- Chunks Retrieval Result Box -->
      <g transform="translate(0, 95)">
        <rect x="0" y="0" width="280" height="85" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
        <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#86efac">Топ-3 найденных фрагмента:</text>
        <text x="12" y="38" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#e2e8f0">• Положение о БРС (Раздел 3, п. 3.2)</text>
        <text x="12" y="54" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#e2e8f0">• Порядок аттестации (Стр. 14)</text>
        <text x="12" y="72" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a7f3d0">«...не менее 40 баллов в семестре...»</text>
      </g>

      <text x="4" y="210" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">
        Поиск за 10–20 мс среди тысяч страниц нормативной документации Политеха
      </text>
    </g>
  </g>

  <!-- Arrow Stage 2 -> Stage 3 -->
  <line x1="685" y1="315" x2="715" y2="315" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrRagGreen)" />

  <!-- STAGE 3: Grounded Answer Synthesis -->
  <g transform="translate(715, 160)" filter="url(#ragShadow)">
    <rect x="0" y="0" width="310" height="310" rx="12" fill="url(#st3Grad)" stroke="#c084fc" stroke-width="1.5" />
    
    <!-- Stage Badge -->
    <rect x="14" y="-12" width="220" height="22" rx="4" fill="#3b0764" stroke="#c084fc" stroke-width="1" />
    <text x="22" y="3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#e9d5ff">
      ЭТАП 3: СИНТЕЗ (GROUNDING)
    </text>

    <g transform="translate(15, 20)">
      <rect x="0" y="0" width="280" height="80" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
      <text x="12" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#d8b4fe">Gemini 2.0 Flash</text>
      <text x="12" y="42" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">temperature: 0.2 (Строгий)</text>
      <text x="12" y="60" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">System Prompt + Chunks + User Query</text>

      <!-- Final Answer Result Box -->
      <g transform="translate(0, 95)">
        <rect x="0" y="0" width="280" height="85" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
        <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f3e8ff">Верифицированный ответ:</text>
        <text x="12" y="38" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#e2e8f0">«Для допуска требуется набрать не</text>
        <text x="12" y="54" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#e2e8f0">менее 40 баллов из 100 возможных.»</text>
        <text x="12" y="72" font-family="'JetBrains Mono', monospace" font-size="9" fill="#c084fc">[Ссылка: Регламент БРС, п. 3.2]</text>
      </g>

      <text x="4" y="210" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">
        Нулевые галлюцинации: ответ сформирован строго по фактам из регламента!
      </text>
    </g>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g transform="translate(35, 490)">
    <rect x="0" y="0" width="990" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="18" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#a855f7">
      Стандарты нарезки и индексации документов (Chunking Strategy):
    </text>
    <text x="18" y="46" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">
      • <tspan font-weight="700" fill="#93c5fd">Chunk Size:</tspan> 1500–2000 символов (400–500 токенов) — охватывает целый пункт статьи регламента.
      • <tspan font-weight="700" fill="#6ee7b7">Chunk Overlap:</tspan> 200 символов (50 токенов) — предотвращает потерю контекста на границе разбиения.
    </text>
    <text x="18" y="66" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">
      • <tspan font-weight="700" fill="#d8b4fe">Метаданные чанка:</tspan> document_title, section, page, url — передаются клиенту в ответе gRPC для кликабельной ссылки на первоисточник.
    </text>
  </g>
</svg>
