<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="100%" height="100%">
  <defs>
    <linearGradient id="pyrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Layer Gradients -->
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="midGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <filter id="shadowBox" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="976" height="516" rx="16" fill="url(#pyrBg)" stroke="#313244" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="10" cy="10" r="6" fill="#10b981" />
    <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#cdd6f4">
      Пирамида тестирования слоев Clean Architecture • Изоляция и скорость обратной связи
    </text>
    <line x1="0" y1="28" x2="916" y2="28" stroke="#313244" stroke-width="1" />
  </g>

  <!-- Level 3: Transport Layer (Top) -->
  <g transform="translate(190, 80)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="600" height="110" rx="10" fill="url(#topGrad)" stroke="#818cf8" stroke-width="1.8" />
    <rect x="16" y="12" width="220" height="22" rx="4" fill="#1e1b4b" />
    <text x="24" y="27" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#c7d2fe">
      УРОВЕНЬ 3: ТРАНСПОРТ (gRPC)
    </text>
    <text x="250" y="27" font-family="'Segoe UI', sans-serif" font-size="10" fill="#a5b4fc">
      Время: ~10–50 мс • bufconn (in-memory сокет)
    </text>

    <text x="24" y="55" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#f1f5f9">
      • Тесты gRPC хендлеров: сериализация Protobuf DTO &lt;-&gt; Domain
    </text>
    <text x="24" y="73" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#f1f5f9">
      • Проверка цепочки интерцепторов: Auth (x-user-id), Logging, Panic Recovery
    </text>
    <text x="24" y="91" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#f1f5f9">
      • Корректность маппинга доменных ошибок в статусы: NotFound, InvalidArgument, Aborted
    </text>
  </g>

  <!-- Level 2: Application / Use Cases (Middle) -->
  <g transform="translate(110, 210)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="760" height="115" rx="10" fill="url(#midGrad)" stroke="#0ea5e9" stroke-width="1.8" />
    <rect x="16" y="12" width="230" height="22" rx="4" fill="#0c4a6e" />
    <text x="24" y="27" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#bae6fd">
      УРОВЕНЬ 2: СЦЕНАРИИ (usecase)
    </text>
    <text x="260" y="27" font-family="'Segoe UI', sans-serif" font-size="10" fill="#7dd3fc">
      Время: ~1–5 мс • In-Memory моки портов (Go interfaces)
    </text>

    <text x="24" y="55" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#f1f5f9">
      • Бизнес-сценарии: CreateTaskUseCase, CompleteTaskUseCase, RescheduleTaskUseCase
    </text>
    <text x="24" y="73" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#f1f5f9">
      • Дедупликация и идемпотентность (IdempotencyStore mock)
    </text>
    <text x="24" y="91" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#f1f5f9">
      • Защита от несанкционированного доступа (IDOR: проверка actorID != ownerID -&gt; ErrAccessDenied)
    </text>
    <text x="24" y="105" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">
      • Корректное оборачивание ошибок через fmt.Errorf("%w")
    </text>
  </g>

  <!-- Level 1: Domain Core (Base) -->
  <g transform="translate(30, 345)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="920" height="120" rx="10" fill="url(#baseGrad)" stroke="#10b981" stroke-width="2" />
    <rect x="16" y="12" width="220" height="22" rx="4" fill="#064e3b" />
    <text x="24" y="27" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#a7f3d0">
      УРОВЕНЬ 1: ДОМЕННОЕ ЯДРО (domain)
    </text>
    <text x="250" y="27" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6ee7b7">
      Время: 0 мс • Чистый Go ($gostd) • 100% покрытие бизнес-правил
    </text>

    <text x="24" y="55" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#f1f5f9">
      • Инварианты сущностей: заголовок не короче 3 символов, валидация дедлайна в будущем
    </text>
    <text x="24" y="73" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#f1f5f9">
      • Состояния задачи: переходы Draft -&gt; InProgress -&gt; Completed, запрет повторного закрытия
    </text>
    <text x="24" y="91" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#f1f5f9">
      • Оптимистическая блокировка: начальная version = 1, инкремент version++ при любых изменениях
    </text>
    <text x="24" y="107" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#6ee7b7">
      • Полное отсутствие внешних моков, фреймворков и баз данных
    </text>
  </g>

  <!-- Left Side Metric Arrow -->
  <text x="50" y="195" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#94a3b8">
    ▲ Скорость / Объем тестов
  </text>
</svg>
