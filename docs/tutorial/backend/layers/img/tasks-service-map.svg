<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Layer Gradients -->
    <linearGradient id="transGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="ucGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="domGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="infraLGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="mapShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Markers -->
    <marker id="arrMapBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrMapPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
    </marker>
    <marker id="arrMapAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrMapGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="1136" height="636" rx="16" fill="url(#mapBg)" stroke="#313244" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="10" cy="10" r="6" fill="#10b981" />
    <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#cdd6f4">
      tasks-service • Карта слоев Clean Architecture и сопоставление файлов кодовой базы
    </text>
    <line x1="0" y1="28" x2="1076" y2="28" stroke="#313244" stroke-width="1" />
  </g>

  <!-- ==================== CLIENTS CALL IN ==================== -->
  <g transform="translate(35, 75)" filter="url(#mapShadow)">
    <rect x="0" y="0" width="190" height="95" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#93c5fd">Внешние вызовы</text>
    <text x="14" y="44" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">• API Gateway (:8080)</text>
    <text x="14" y="60" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">• ai-service (:50057)</text>
    <text x="14" y="80" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">gRPC по HTTP/2</text>
  </g>

  <!-- Connector to Transport Adapter -->
  <line x1="225" y1="122" x2="265" y2="122" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrMapBlue)" />

  <!-- ==================== 1. TRANSPORT LAYER ==================== -->
  <g transform="translate(270, 75)" filter="url(#mapShadow)">
    <rect x="0" y="0" width="245" height="440" rx="12" fill="url(#transGrad)" stroke="#6366f1" stroke-width="2" />
    <rect x="14" y="-12" width="200" height="22" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
    <text x="22" y="3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#c7d2fe">
      1. TRANSPORT ADAPTER
    </text>

    <g transform="translate(15, 20)">
      <!-- File 1: interceptors.go -->
      <rect x="0" y="0" width="215" height="115" rx="8" fill="#181825" stroke="#4f46e5" stroke-width="1" />
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#a5b4fc">interceptors.go</text>
      <text x="12" y="38" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• AuthInterceptor (x-user-id)</text>
      <text x="12" y="54" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• RecoveryInterceptor (паники)</text>
      <text x="12" y="70" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• LoggingInterceptor (trace_id)</text>
      <text x="12" y="94" font-family="'JetBrains Mono', monospace" font-size="9" fill="#86efac">Context &lt;-- actorID</text>

      <!-- Flow down to handler.go -->
      <path d="M 107 115 L 107 145" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrMapPurple)" />

      <!-- File 2: handler.go -->
      <rect x="0" y="150" width="215" height="155" rx="8" fill="#181825" stroke="#4f46e5" stroke-width="1" />
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#a5b4fc">handler.go</text>
      <text x="12" y="38" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• CreateTask(ctx, req)</text>
      <text x="12" y="54" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• GetTask(ctx, req)</text>
      <text x="12" y="70" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• CompleteTask(ctx, req)</text>
      <text x="12" y="86" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• ListTasks(ctx, req)</text>
      <line x1="12" y1="98" x2="203" y2="98" stroke="#312e81" stroke-width="1" />
      <text x="12" y="116" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">Маппинг DTO &lt;--&gt; Proto</text>
      <text x="12" y="132" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#fca5a5">Маппинг доменных ошибок</text>
      <text x="12" y="146" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#a5b4fc">status.Error(codes.NotFound)</text>
    </g>

    <text x="15" y="420" font-family="'JetBrains Mono', monospace" font-size="9" fill="#818cf8">
      internal/transport/taskgrpc/
    </text>
  </g>

  <!-- Connector from Transport to Use Cases -->
  <line x1="515" y1="280" x2="555" y2="280" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrMapPurple)" />

  <!-- ==================== 2. USE CASE LAYER & PORTS ==================== -->
  <g transform="translate(560, 75)" filter="url(#mapShadow)">
    <rect x="0" y="0" width="250" height="440" rx="12" fill="url(#ucGrad)" stroke="#0ea5e9" stroke-width="2" />
    <rect x="14" y="-12" width="210" height="22" rx="4" fill="#082f49" stroke="#38bdf8" stroke-width="1" />
    <text x="22" y="3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#7dd3fc">
      2. USE CASE &amp; PORTS
    </text>

    <g transform="translate(15, 20)">
      <!-- File 1: create_task.go -->
      <rect x="0" y="0" width="220" height="80" rx="8" fill="#181825" stroke="#0284c7" stroke-width="1" />
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#7dd3fc">create_task.go</text>
      <text x="12" y="38" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">CreateTaskUseCase struct</text>
      <text x="12" y="54" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• Проверка идемпотентности</text>
      <text x="12" y="70" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• Сохранение и событие</text>

      <!-- File 2: get_task.go -->
      <rect x="0" y="95" width="220" height="80" rx="8" fill="#181825" stroke="#0284c7" stroke-width="1" />
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#7dd3fc">get_task.go</text>
      <text x="12" y="38" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">GetTask, ListTasks,</text>
      <text x="12" y="54" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">CompleteTaskUseCase</text>
      <text x="12" y="70" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#86efac">• Проверка авторства actorID</text>

      <!-- File 3: ports.go (Interfaces) -->
      <rect x="0" y="190" width="220" height="120" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="1.5" />
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#ffffff">ports.go (Интерфейсы)</text>
      <text x="12" y="38" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a5f3fc">• TaskSaver interface</text>
      <text x="12" y="54" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a5f3fc">• TaskFinder interface</text>
      <text x="12" y="70" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a5f3fc">• EventPublisher interface</text>
      <text x="12" y="86" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a5f3fc">• IdempotencyStore interface</text>
      <text x="12" y="106" font-family="'Segoe UI', sans-serif" font-size="9" fill="#bae6fd">DIP: Порты принадлежат Usecase!</text>
    </g>

    <text x="15" y="420" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">
      internal/usecase/
    </text>
  </g>

  <!-- Connectors from Usecase to Domain -->
  <line x1="810" y1="180" x2="850" y2="180" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrMapAmber)" />

  <!-- ==================== 3. DOMAIN CORE ==================== -->
  <g transform="translate(855, 75)" filter="url(#mapShadow)">
    <rect x="0" y="0" width="250" height="205" rx="12" fill="url(#domGrad)" stroke="#f59e0b" stroke-width="2" />
    <rect x="14" y="-12" width="200" height="22" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
    <text x="22" y="3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#fde68a">
      3. DOMAIN CORE ($gostd)
    </text>

    <g transform="translate(15, 20)">
      <rect x="0" y="0" width="220" height="150" rx="8" fill="#1c1917" stroke="#78350f" stroke-width="1" />
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#fde68a">task.go (Агрегат Task)</text>
      <text x="12" y="38" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• Инварианты переходов статуса</text>
      <text x="12" y="54" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• Оптимистичные версии (version++)</text>
      <text x="12" y="74" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#fde68a">Value Objects &amp; Ошибки:</text>
      <text x="12" y="92" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">• TaskID, OwnerID, Title</text>
      <text x="12" y="108" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fca5a5">• ErrTaskNotFound, ErrVersionConflict</text>
      <text x="12" y="132" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#fef08a">СТРОГО ТОЛЬКО СТАНДАРТ GO!</text>
    </g>

    <text x="15" y="195" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fde68a">
      internal/domain/
    </text>
  </g>

  <!-- ==================== 4. INFRASTRUCTURE ADAPTERS ==================== -->
  <g transform="translate(855, 305)" filter="url(#mapShadow)">
    <rect x="0" y="0" width="250" height="210" rx="12" fill="url(#infraLGrad)" stroke="#10b981" stroke-width="2" />
    <rect x="14" y="-12" width="220" height="22" rx="4" fill="#022c22" stroke="#10b981" stroke-width="1" />
    <text x="22" y="3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#6ee7b7">
      4. INFRASTRUCTURE (Выход)
    </text>

    <g transform="translate(15, 20)">
      <rect x="0" y="0" width="220" height="155" rx="8" fill="#181825" stroke="#047857" stroke-width="1" />
      <text x="12" y="20" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#6ee7b7">Реализация портов (DIP):</text>
      <text x="12" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">• postgres/task_repository.go</text>
      <text x="12" y="52" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">  (pgxpool, транзакции, Outbox)</text>
      <text x="12" y="70" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">• redis/idempotency_store.go</text>
      <text x="12" y="84" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">  (Check &amp; Set, TTL дедупликация)</text>
      <text x="12" y="102" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">• rabbitmq/event_publisher.go</text>
      <text x="12" y="116" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">  (AMQP 0-9-1 Topic Exchange)</text>
      <text x="12" y="134" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">• idgen/id_generator.go (UUID)</text>
    </g>

    <text x="15" y="200" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6ee7b7">
      internal/infrastructure/
    </text>
  </g>

  <!-- DIP Link: Infrastructure implements Ports -->
  <line x1="855" y1="360" x2="810" y2="360" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrMapGreen)" />
  <rect x="795" y="348" width="55" height="18" rx="3" fill="#022c22" />
  <text x="822" y="361" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#86efac">implements</text>

  <!-- ==================== 5. COMPOSITION ROOT (cmd/main.go) ==================== -->
  <g transform="translate(35, 535)">
    <rect x="0" y="0" width="1070" height="85" rx="10" fill="url(#rootGrad)" stroke="#475569" stroke-width="1.5" />
    <rect x="18" y="-12" width="310" height="22" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1" />
    <text x="26" y="3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#e2e8f0">
      5. COMPOSITION ROOT (cmd/tasks-service/main.go)
    </text>

    <text x="20" y="28" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc">
      Единственное место во всём сервисе, знающее обо всех слоях:
    </text>
    <text x="20" y="48" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">
      1. Читает конфигурацию (.env) ──&gt; 2. Подключает PostgreSQL, Redis, RabbitMQ ──&gt; 3. Инстанциирует адаптеры инфраструктуры ──&gt;
    </text>
    <text x="20" y="66" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">
      4. Внедряет их в Use Cases (Dependency Injection) ──&gt; 5. Создаёт gRPC сервер с хендлерами и интерцепторами ──&gt; 6. Graceful Shutdown по SIGINT/SIGTERM.
    </text>
  </g>
</svg>
