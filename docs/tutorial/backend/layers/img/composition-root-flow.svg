<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 700" width="100%" height="100%">
  <defs>
    <linearGradient id="crBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>

    <filter id="shadowBox" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="1016" height="696" rx="16" fill="url(#crBg)" stroke="#313244" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="10" cy="10" r="6" fill="#3b82f6" />
    <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#cdd6f4">
      Composition Root • Алгоритм сборки графа зависимостей и Graceful Shutdown (cmd/main.go)
    </text>
    <line x1="0" y1="28" x2="956" y2="28" stroke="#313244" stroke-width="1" />
  </g>

  <!-- ==================== FLOWCHART COLUMN 1: Startup Pipeline ==================== -->

  <!-- Step 0: Terminator Start -->
  <g transform="translate(60, 75)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="400" height="38" rx="19" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2" />
    <text x="200" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#93c5fd">
      ▶️ Точка входа: func run() in main.go
    </text>
  </g>

  <!-- Down arrow -->
  <line x1="260" y1="113" x2="260" y2="135" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrBlue)" />

  <!-- Step 1: Config -->
  <g transform="translate(60, 135)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="400" height="52" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="20" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#60a5fa">1. cfg, err := config.Load()</text>
    <text x="20" y="40" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Чтение переменных .env, Fail-Fast валидация портов и DSN</text>
  </g>

  <!-- Down arrow -->
  <line x1="260" y1="187" x2="260" y2="207" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrBlue)" />

  <!-- Step 2: Logger -->
  <g transform="translate(60, 207)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="400" height="52" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="20" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#60a5fa">2. logger := buildLogger(cfg)</text>
    <text x="20" y="40" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Инициализация structured slog (TextHandler для dev, JSON в prod)</text>
  </g>

  <!-- Down arrow -->
  <line x1="260" y1="259" x2="260" y2="279" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrBlue)" />

  <!-- Step 3: Signal Context -->
  <g transform="translate(60, 279)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="400" height="52" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="20" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#c4b5fd">3. signal.NotifyContext(ctx, SIGINT, SIGTERM)</text>
    <text x="20" y="40" font-family="'Segoe UI', sans-serif" font-size="10" fill="#a5b4fc">Перехват сигналов операционной системы для Graceful Shutdown</text>
  </g>

  <!-- Down arrow -->
  <line x1="260" y1="331" x2="260" y2="351" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrBlue)" />

  <!-- Step 4: Infrastructure Adapters -->
  <g transform="translate(60, 351)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="400" height="85" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="20" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#6ee7b7">4. Инициализация инфраструктуры:</text>
    <text x="20" y="40" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a7f3d0">• repo := postgres.NewTaskRepository(pool)</text>
    <text x="20" y="56" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a7f3d0">• idempStore := redis.NewIdempotencyStore(rdb)</text>
    <text x="20" y="72" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a7f3d0">• publisher := rabbitmq.NewEventPublisher(ch)</text>
  </g>

  <!-- Down arrow -->
  <line x1="260" y1="436" x2="260" y2="456" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrBlue)" />

  <!-- Step 5: Use Cases -->
  <g transform="translate(60, 456)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="400" height="95" rx="8" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="20" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">5. Сборка сценариев (Use Cases):</text>
    <text x="20" y="40" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e0f2fe">• createUC := usecase.NewCreateTaskUseCase(repo, pub)</text>
    <text x="20" y="56" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e0f2fe">• getUC := usecase.NewGetTaskUseCase(repo)</text>
    <text x="20" y="72" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e0f2fe">• listUC := usecase.NewListTasksUseCase(repo)</text>
    <text x="20" y="88" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e0f2fe">• completeUC := usecase.NewCompleteTaskUseCase(repo)</text>
  </g>

  <!-- Down arrow to Column 2 -->
  <path d="M 260 551 L 260 590 L 530 590 L 530 110 L 552 110" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrBlue)" />

  <!-- ==================== FLOWCHART COLUMN 2: Server Assembly & Shutdown ==================== -->

  <!-- Step 6: gRPC Handler -->
  <g transform="translate(560, 85)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="400" height="52" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="20" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#60a5fa">6. handler := taskgrpc.NewHandler(...)</text>
    <text x="20" y="40" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Внедрение usecase в сетевой слой транспортных DTO</text>
  </g>

  <!-- Down arrow -->
  <line x1="760" y1="137" x2="760" y2="157" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrBlue)" />

  <!-- Step 7: Interceptors & grpc.NewServer -->
  <g transform="translate(560, 157)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="400" height="95" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
    <text x="20" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#c4b5fd">7. grpc.ChainUnaryInterceptor(</text>
    <text x="20" y="40" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a5b4fc">   1. LoggingInterceptor(logger),   // Время, статус</text>
    <text x="20" y="56" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a5b4fc">   2. RecoveryInterceptor(logger),  // Защита от паник</text>
    <text x="20" y="72" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a5b4fc">   3. AuthInterceptor(),            // x-user-id -&gt; ctx</text>
    <text x="20" y="88" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#c4b5fd">)</text>
  </g>

  <!-- Down arrow -->
  <line x1="760" y1="252" x2="760" y2="272" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrBlue)" />

  <!-- Step 8: Listen & Serve -->
  <g transform="translate(560, 272)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="400" height="52" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="20" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#6ee7b7">8. go grpcServer.Serve(listener)</text>
    <text x="20" y="40" font-family="'Segoe UI', sans-serif" font-size="10" fill="#a7f3d0">Асинхронный запуск сетевого цикла gRPC в отдельной горутине</text>
  </g>

  <!-- Down branch: Signal trigger -->
  <path d="M 460 305 L 500 305 L 500 375 L 552 375" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrRed)" />
  <rect x="475" y="330" width="55" height="18" rx="3" fill="#450a0a" stroke="#ef4444" stroke-width="1" />
  <text x="502" y="343" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#fca5a5">SIGINT</text>

  <!-- Step 9: Graceful Shutdown -->
  <g transform="translate(560, 355)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="400" height="120" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.8" />
    <text x="20" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fca5a5">
      🛑 9. GRACEFUL SHUTDOWN (Остановка)
    </text>
    <text x="20" y="44" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fecaca">• Ожидание &lt;-ctx.Done() (получен сигнал ОС)</text>
    <text x="20" y="62" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fecaca">• grpcServer.GracefulStop() (дообработка активных вызовов)</text>
    <text x="20" y="80" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fecaca">• Закрытие пулов соединений: pool.Close(), rdb.Close()</text>
    <text x="20" y="102" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fca5a5">Таймаут аварийной остановки: 5 секунд</text>
  </g>

  <!-- Down arrow to End -->
  <line x1="760" y1="475" x2="760" y2="505" stroke="#10b981" stroke-width="2" marker-end="url(#arrGreen)" />

  <!-- Step 10: Terminator End -->
  <g transform="translate(660, 505)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="200" height="38" rx="19" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="100" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#6ee7b7">
      ⏹️ Корректный выход
    </text>
  </g>
</svg>
