<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%">
  <defs>
    <linearGradient id="dwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>

    <filter id="shadowBox" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="1016" height="536" rx="16" fill="url(#dwBg)" stroke="#313244" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="10" cy="10" r="6" fill="#ef4444" />
    <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#cdd6f4">
      Проблема Dual-Write • Почему нельзя одновременно писать в БД и брокер без Outbox
    </text>
    <line x1="0" y1="28" x2="956" y2="28" stroke="#313244" stroke-width="1" />
  </g>

  <!-- Lifelines -->
  <line x1="140" y1="110" x2="140" y2="500" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="400" y1="110" x2="400" y2="500" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="680" y1="110" x2="680" y2="500" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="900" y1="110" x2="900" y2="500" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Participants -->
  <g transform="translate(50, 68)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="180" height="42" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="90" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#93c5fd">👤 Клиент (Gateway)</text>
    <text x="90" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">Внешний вызов</text>
  </g>

  <g transform="translate(300, 68)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="200" height="42" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.5" />
    <text x="100" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#bae6fd">⚙️ CreateTaskUseCase</text>
    <text x="100" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#7dd3fc">Бизнес-сценарий</text>
  </g>

  <g transform="translate(590, 68)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="180" height="42" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.5" />
    <text x="90" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#bbf7d0">🐘 База данных (Save)</text>
    <text x="90" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#86efac">PostgreSQL</text>
  </g>

  <g transform="translate(810, 68)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="180" height="42" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="1.5" />
    <text x="90" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#fde68a">🐇 RabbitMQ (Publish)</text>
    <text x="90" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fcd34d">Брокер сообщений</text>
  </g>

  <!-- Step 1: Client -> UseCase -->
  <line x1="140" y1="145" x2="392" y2="145" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrCyan)" />
  <rect x="180" y="130" width="160" height="16" rx="3" fill="#0f172a" />
  <text x="185" y="141" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#67e8f9">1. CreateTask(ctx, cmd)</text>

  <!-- Step 2: UseCase -> DB -->
  <line x1="400" y1="180" x2="672" y2="180" stroke="#10b981" stroke-width="2" marker-end="url(#arrGreen)" />
  <rect x="450" y="166" width="170" height="16" rx="3" fill="#0f172a" />
  <text x="455" y="177" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#86efac">2. repo.Save(ctx, task)</text>

  <!-- DB Success box -->
  <g transform="translate(620, 205)">
    <rect x="0" y="0" width="150" height="24" rx="4" fill="#022c22" stroke="#10b981" stroke-width="1" />
    <text x="75" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#6ee7b7">
      ✅ УСПЕШНО ЗАПИСАНО
    </text>
  </g>

  <!-- Step 3: UseCase -> Broker (NETWORK CRASH / FAILURE) -->
  <g transform="translate(420, 250)">
    <rect x="0" y="0" width="460" height="32" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
    <text x="230" y="21" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#fca5a5">
      💥 АВАРИЯ: Сбой сети / падение RabbitMQ / таймаут сокета
    </text>
  </g>

  <!-- Attempted publish with RED X -->
  <line x1="400" y1="315" x2="880" y2="315" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6 4" />
  <circle cx="650" cy="315" r="16" fill="#7f1d1d" stroke="#ef4444" stroke-width="2" />
  <text x="650" y="321" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#ffffff">✕</text>
  <rect x="440" y="292" width="190" height="16" rx="3" fill="#0f172a" />
  <text x="445" y="303" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#fca5a5">PublishTaskCreated() -&gt; ERROR!</text>

  <!-- Step 4: UseCase returns error to Client -->
  <line x1="392" y1="365" x2="148" y2="365" stroke="#ef4444" stroke-width="2" marker-end="url(#arrRed)" />
  <rect x="180" y="352" width="190" height="16" rx="3" fill="#0f172a" />
  <text x="185" y="363" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#fca5a5">HTTP 500 Ошибка создания задачи</text>

  <!-- Critical Disaster Banner -->
  <g transform="translate(140, 410)">
    <rect x="0" y="0" width="760" height="90" rx="10" fill="#020617" stroke="#ef4444" stroke-width="1.8" />
    
    <rect x="16" y="12" width="280" height="22" rx="4" fill="#7f1d1d" />
    <text x="24" y="27" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#ffffff">
      🚨 КАТАСТРОФА РАССИНХРОНИЗАЦИИ:
    </text>

    <text x="24" y="52" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#fca5a5">
      1. Задача в базе данных сохранена, но клиент уверен, что операция провалилась!
    </text>
    <text x="24" y="72" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#fca5a5">
      2. Событие в RabbitMQ утеряно навсегда — уведомления не придут, аналитика сломается.
    </text>
    <text x="24" y="92" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#34d399">
      👉 РЕШЕНИЕ: Паттерн Transactional Outbox (сохранение события в БД в единой транзакции)
    </text>
  </g>
</svg>
