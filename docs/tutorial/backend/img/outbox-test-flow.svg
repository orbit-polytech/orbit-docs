<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%">
  <defs>
    <linearGradient id="testBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>

    <filter id="shadowBox" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="1016" height="536" rx="16" fill="url(#testBg)" stroke="#313244" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="10" cy="10" r="6" fill="#10b981" />
    <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#cdd6f4">
      Интеграционное тестирование • Сквозной тест Transactional Outbox в PostgreSQL и RabbitMQ
    </text>
    <line x1="0" y1="28" x2="956" y2="28" stroke="#313244" stroke-width="1" />
  </g>

  <!-- Lifelines -->
  <line x1="110" y1="110" x2="110" y2="500" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="320" y1="110" x2="320" y2="500" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="530" y1="110" x2="530" y2="500" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="740" y1="110" x2="740" y2="500" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="910" y1="110" x2="910" y2="500" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Participants -->
  <g transform="translate(30, 68)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="160" height="42" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="80" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#93c5fd">🧪 Интеграционный тест</text>
    <text x="80" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">go test -race (dockertest)</text>
  </g>

  <g transform="translate(240, 68)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="160" height="42" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="80" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#a7f3d0">⚙️ TaskRepository</text>
    <text x="80" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6ee7b7">Репозиторий с Outbox</text>
  </g>

  <g transform="translate(450, 68)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="160" height="42" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.5" />
    <text x="80" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#bbf7d0">🐘 PostgreSQL 16</text>
    <text x="80" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#86efac">tasks_db (Docker)</text>
  </g>

  <g transform="translate(660, 68)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="160" height="42" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="80" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#c4b5fd">🔄 OutboxWorker</text>
    <text x="80" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a5b4fc">Фоновый процесс</text>
  </g>

  <g transform="translate(840, 68)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="140" height="42" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="1.5" />
    <text x="70" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#fde68a">🐇 RabbitMQ</text>
    <text x="70" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fcd34d">Очередь задач</text>
  </g>

  <!-- Step 1: Test -> Repo -->
  <line x1="110" y1="140" x2="314" y2="140" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrCyan)" />
  <rect x="125" y="125" width="170" height="15" rx="3" fill="#0f172a" />
  <text x="130" y="136" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#67e8f9">1. CreateWithOutbox(task, evt)</text>

  <!-- Step 2: Repo -> DB -->
  <line x1="320" y1="165" x2="524" y2="165" stroke="#10b981" stroke-width="2" marker-end="url(#arrEmerald)" />
  <rect x="330" y="152" width="180" height="15" rx="3" fill="#0f172a" />
  <text x="335" y="163" font-family="'JetBrains Mono', monospace" font-size="8" fill="#86efac">2. INSERT tasks &amp; outbox_events</text>

  <!-- DB commit -->
  <g transform="translate(535, 175)">
    <rect x="0" y="0" width="140" height="24" rx="4" fill="#022c22" stroke="#10b981" stroke-width="1" />
    <text x="70" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#6ee7b7">TX COMMIT OK</text>
  </g>

  <!-- Step 3: Test -> Worker trigger -->
  <line x1="110" y1="225" x2="734" y2="225" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrPurple)" />
  <rect x="360" y="212" width="160" height="16" rx="3" fill="#0f172a" />
  <text x="365" y="223" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#c4b5fd">3. ProcessBatch() (запуск воркера)</text>

  <!-- Step 4: Worker -> DB -->
  <line x1="740" y1="260" x2="536" y2="260" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arrPurple)" />
  <rect x="548" y="248" width="180" height="15" rx="3" fill="#0f172a" />
  <text x="552" y="259" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#c4b5fd">4. SELECT FOR UPDATE SKIP LOCKED</text>

  <!-- Step 5: Worker -> RabbitMQ -->
  <line x1="740" y1="300" x2="904" y2="300" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrAmber)" />
  <rect x="748" y="288" width="150" height="15" rx="3" fill="#0f172a" />
  <text x="752" y="299" font-family="'JetBrains Mono', monospace" font-size="8" fill="#fde68a">5. Publish(orbit.events)</text>

  <!-- Step 6: Worker -> DB update -->
  <line x1="740" y1="340" x2="536" y2="340" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrEmerald)" />
  <rect x="550" y="328" width="180" height="15" rx="3" fill="#0f172a" />
  <text x="555" y="339" font-family="'JetBrains Mono', monospace" font-size="8" fill="#86efac">6. UPDATE status='PROCESSED'</text>

  <!-- Step 7: Test -> RabbitMQ read -->
  <line x1="110" y1="390" x2="904" y2="390" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrCyan)" />
  <rect x="420" y="378" width="220" height="15" rx="3" fill="#0f172a" />
  <text x="425" y="389" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#67e8f9">7. Чтение из очереди notif.tasks.created</text>

  <!-- Step 8: RabbitMQ -> Test Assertion -->
  <line x1="904" y1="435" x2="116" y2="435" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrEmerald)" />
  <rect x="380" y="420" width="310" height="22" rx="4" fill="#022c22" stroke="#10b981" stroke-width="1" />
  <text x="535" y="435" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#6ee7b7">
    ✅ Сообщение получено и совпадает с исходным! (assert.Equal)
  </text>
</svg>
