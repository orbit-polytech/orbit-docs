<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="rmqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Zone Gradients -->
    <linearGradient id="pubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="brokerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="rmqShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Markers -->
    <marker id="arrRmqOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f97316" />
    </marker>
    <marker id="arrRmqGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrRmqRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="1056" height="556" rx="16" fill="url(#rmqBg)" stroke="#313244" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="10" cy="10" r="6" fill="#f97316" />
    <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#cdd6f4">
      Топология RabbitMQ AMQP 0-9-1 &amp; Паттерн Transactional Outbox
    </text>
    <line x1="0" y1="28" x2="996" y2="28" stroke="#313244" stroke-width="1" />
  </g>

  <!-- ==================== 1. PUBLISHER (tasks-service) ==================== -->
  <g transform="translate(30, 75)" filter="url(#rmqShadow)">
    <rect x="0" y="0" width="240" height="375" rx="12" fill="url(#pubGrad)" stroke="#10b981" stroke-width="1.5" />
    <rect x="14" y="-12" width="190" height="22" rx="4" fill="#022c22" stroke="#10b981" stroke-width="1" />
    <text x="22" y="3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#6ee7b7">
      ИЗДАТЕЛЬ: tasks-service
    </text>

    <!-- Local DB Transaction -->
    <g transform="translate(15, 20)">
      <rect x="0" y="0" width="210" height="115" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1" />
      <text x="12" y="22" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8">🐘 PostgreSQL Transaction</text>
      <text x="12" y="42" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">BEGIN;</text>
      <text x="12" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">INSERT INTO tasks.tasks ...</text>
      <text x="12" y="74" font-family="'JetBrains Mono', monospace" font-size="9" fill="#86efac">INSERT INTO outbox_events ...</text>
      <text x="12" y="92" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">COMMIT; <tspan fill="#6ee7b7">(Атомарно!)</tspan></text>
      <text x="12" y="108" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">Защита от сбоя сети и Dual-Write</text>
    </g>

    <!-- Outbox Relay Worker -->
    <g transform="translate(15, 155)">
      <rect x="0" y="0" width="210" height="115" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="12" y="22" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#fde68a">⚙️ Outbox Relay Worker</text>
      <text x="12" y="42" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">1. SELECT outbox_events</text>
      <text x="12" y="56" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">   WHERE processed_at IS NULL</text>
      <text x="12" y="74" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fb923c">2. BasicPublish(amqp)</text>
      <text x="12" y="92" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">3. UPDATE processed_at=now</text>
      <text x="12" y="108" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">Полинг каждые 500мс / pg_notify</text>
    </g>

    <text x="15" y="305" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#86efac">
      ✓ Ни одно событие не потеряется!
    </text>
    <text x="15" y="325" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">
      Гарантия доставки: At-Least-Once
    </text>
  </g>

  <!-- Connect line from Outbox Relay to RabbitMQ Exchange -->
  <line x1="270" y1="250" x2="330" y2="250" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrRmqOrange)" />

  <!-- ==================== 2. RABBITMQ BROKER ==================== -->
  <g transform="translate(335, 75)" filter="url(#rmqShadow)">
    <rect x="0" y="0" width="415" height="375" rx="12" fill="url(#brokerGrad)" stroke="#f97316" stroke-width="2" />
    <rect x="14" y="-12" width="220" height="22" rx="4" fill="#7c2d12" stroke="#f97316" stroke-width="1" />
    <text x="22" y="3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#fed7aa">
      БРОКЕР: RabbitMQ 3.13 / 4
    </text>

    <!-- Exchange: orbit.events (topic) -->
    <g transform="translate(15, 20)">
      <rect x="0" y="0" width="385" height="68" rx="8" fill="#181825" stroke="#ea580c" stroke-width="1.5" />
      <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#fb923c">🔄 Topic Exchange: orbit.events</text>
      <text x="14" y="44" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#fdba74">Routing Key: tasks.v1.task.created</text>
      <text x="14" y="58" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">Паттерн: &lt;сервис&gt;.&lt;версия&gt;.&lt;сущность&gt;.&lt;действие&gt;</text>
    </g>

    <!-- Branch Arrows from Exchange to Queues -->
    <path d="M 120 88 L 120 120 L 50 120 L 50 135" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#arrRmqOrange)" />
    <path d="M 280 88 L 280 120 L 330 120 L 330 135" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#arrRmqOrange)" />

    <!-- Queue 1: notif.tasks.created -->
    <g transform="translate(15, 140)">
      <rect x="0" y="0" width="185" height="110" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="10" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#fde68a">Очередь 1:</text>
      <text x="10" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ffffff">notif.tasks.created</text>
      <text x="10" y="58" font-family="'Segoe UI', sans-serif" font-size="9" fill="#cbd5e1">Binding: tasks.v1.*.created</text>
      <text x="10" y="74" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">durable: true, prefetch: 10</text>
      <text x="10" y="94" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#fca5a5">x-dead-letter: orbit.events.dlx</text>
    </g>

    <!-- Queue 2: ai.tasks.created -->
    <g transform="translate(215, 140)">
      <rect x="0" y="0" width="185" height="110" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
      <text x="10" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#d8b4fe">Очередь 2:</text>
      <text x="10" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ffffff">ai.tasks.created</text>
      <text x="10" y="58" font-family="'Segoe UI', sans-serif" font-size="9" fill="#cbd5e1">Binding: tasks.v1.#</text>
      <text x="10" y="74" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">durable: true, prefetch: 5</text>
      <text x="10" y="94" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#fca5a5">x-dead-letter: orbit.events.dlx</text>
    </g>

    <!-- Dead Letter Exchange (DLX) & DLQ -->
    <g transform="translate(15, 275)">
      <rect x="0" y="0" width="385" height="85" rx="8" fill="#181825" stroke="#ef4444" stroke-width="1.5" />
      <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f87171">☠️ Dead Letter Exchange: orbit.events.dlx</text>
      <text x="14" y="44" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#fecaca">Очередь изоляции ошибок: orbit.events.dlq</text>
      <text x="14" y="62" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#cbd5e1">Сюда попадают сообщения после 3 неудачных попыток обработки (Reject / Nack)</text>
      <text x="14" y="76" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">Защита от бесконечного цикла отравленных сообщений (Poison Pills)</text>
    </g>

    <!-- Failure Arrow to DLX -->
    <path d="M 105 250 L 105 270" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrRmqRed)" />
  </g>

  <!-- Connectors from Queues to Consumers -->
  <line x1="535" y1="205" x2="780" y2="160" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrRmqOrange)" />
  <line x1="735" y1="205" x2="780" y2="285" stroke="#a855f7" stroke-width="2" marker-end="url(#arrRmqOrange)" />

  <!-- ==================== 3. CONSUMERS ==================== -->
  <g transform="translate(785, 75)" filter="url(#rmqShadow)">
    <rect x="0" y="0" width="245" height="375" rx="12" fill="url(#subGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="14" y="-12" width="170" height="22" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="22" y="3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#94a3b8">
      ПОДПИСЧИКИ (CONSUMERS)
    </text>

    <!-- Consumer 1: notification-service -->
    <g transform="translate(15, 25)">
      <rect x="0" y="0" width="215" height="120" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="12" y="24" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#fde68a">notification-service</text>
      <text x="12" y="44" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">1. Проверка idempotency_key</text>
      <text x="12" y="60" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">2. Отправка Push в мобилку</text>
      <text x="12" y="76" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">3. Отправка в Telegram-бот</text>
      <rect x="12" y="86" width="130" height="22" rx="4" fill="#064e3b" />
      <text x="20" y="101" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#86efac">d.Ack(false) ✓</text>
    </g>

    <!-- Consumer 2: ai-service -->
    <g transform="translate(15, 175)">
      <rect x="0" y="0" width="215" height="120" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
      <text x="12" y="24" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#d8b4fe">ai-service (Python)</text>
      <text x="12" y="44" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">1. Десериализация payload</text>
      <text x="12" y="60" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">2. Генерация эмбеддингов</text>
      <text x="12" y="76" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">3. Обновление HNSW графа</text>
      <rect x="12" y="86" width="130" height="22" rx="4" fill="#064e3b" />
      <text x="20" y="101" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#86efac">d.Ack(false) ✓</text>
    </g>

    <text x="15" y="325" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">
      Подписчики не зависят от tasks-service:
    </text>
    <text x="15" y="345" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#6ee7b7">
      Слабая связность (Loose Coupling)
    </text>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g transform="translate(30, 470)">
    <rect x="0" y="0" width="1000" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="18" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f97316">
      Архитектурный стандарт обработки ошибок в RabbitMQ (Nack vs Ack):
    </text>
    <text x="18" y="42" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">
      При временной ошибке (PostgreSQL недоступен) сообщение возвращается в очередь: <tspan font-family="'JetBrains Mono', monospace" fill="#fde68a">d.Nack(false, requeue=true)</tspan>.
      При фатальной ошибке данных сообщение отправляется в Dead Letter Queue: <tspan font-family="'JetBrains Mono', monospace" fill="#fca5a5">d.Nack(false, requeue=false)</tspan>.
    </text>
  </g>
</svg>
