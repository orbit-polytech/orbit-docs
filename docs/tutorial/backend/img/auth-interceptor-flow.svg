<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%">
  <defs>
    <linearGradient id="intBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>

    <filter id="shadowBox" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="1016" height="536" rx="16" fill="url(#intBg)" stroke="#313244" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="10" cy="10" r="6" fill="#8b5cf6" />
    <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#cdd6f4">
      ADR-004 • Передача контекста пользователя через gRPC-метаданные и AuthInterceptor
    </text>
    <line x1="0" y1="28" x2="956" y2="28" stroke="#313244" stroke-width="1" />
  </g>

  <!-- Lifelines -->
  <line x1="130" y1="110" x2="130" y2="500" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="440" y1="110" x2="440" y2="500" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="840" y1="110" x2="840" y2="500" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Participants -->
  <g transform="translate(40, 68)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="180" height="42" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="90" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#93c5fd">📱 Flutter App</text>
    <text x="90" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#64748b">Внешний контур</text>
  </g>

  <g transform="translate(340, 68)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="200" height="42" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
    <text x="100" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#c7d2fe">🛡️ API Gateway</text>
    <text x="100" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a5b4fc">Периметр безопасности (:8080)</text>
  </g>

  <g transform="translate(740, 68)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="200" height="42" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="100" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#a7f3d0">⚙️ tasks-service</text>
    <text x="100" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#6ee7b7">Внутренний контур (:50055)</text>
  </g>

  <!-- Step 1: Mobile -> Gateway -->
  <line x1="130" y1="140" x2="432" y2="140" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrCyan)" />
  <rect x="145" y="124" width="270" height="16" rx="3" fill="#0f172a" />
  <text x="150" y="135" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#67e8f9">HTTP POST /api/v1/tasks [Bearer &lt;JWT&gt;]</text>

  <!-- Gateway Inspection Box -->
  <g transform="translate(455, 150)">
    <rect x="0" y="0" width="310" height="75" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" />
    <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#a5b4fc">
      ВАЛИДАЦИЯ НА ШЛЮЗЕ (Edge)
    </text>
    <text x="12" y="35" font-family="'Segoe UI', sans-serif" font-size="9" fill="#e0e7ff">• 1. Проверка подписи Ed25519 (0 мс, в памяти)</text>
    <text x="12" y="50" font-family="'Segoe UI', sans-serif" font-size="9" fill="#e0e7ff">• 2. Проверка exp/nbf и Blacklist</text>
    <text x="12" y="65" font-family="'Segoe UI', sans-serif" font-size="9" fill="#67e8f9">• 3. Извлечение claims: sub -&gt; user_id ("018f23...")</text>
  </g>

  <!-- Step 2: Gateway -> tasks-service -->
  <line x1="440" y1="245" x2="832" y2="245" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrPurple)" />
  <rect x="470" y="232" width="330" height="16" rx="3" fill="#0f172a" />
  <text x="475" y="243" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#c4b5fd">gRPC CreateTask() | Metadata: x-user-id: "student-uuid-42"</text>

  <!-- Tasks Interceptor Box -->
  <g transform="translate(680, 265)">
    <rect x="0" y="0" width="310" height="85" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
    <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#a7f3d0">
      AuthInterceptor ВНУТРИ СЕРВИСА
    </text>
    <text x="12" y="35" font-family="'Segoe UI', sans-serif" font-size="9" fill="#e0e7ff">• 4. Валидация заголовка (не пуст, длина &lt;= 64)</text>
    <text x="12" y="50" font-family="'Segoe UI', sans-serif" font-size="9" fill="#e0e7ff">• 5. Запись actor в context.Context</text>
    <text x="12" y="66" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#86efac">ctx = WithActor(ctx, Actor{ID: uid})</text>
    <text x="12" y="78" font-family="'Segoe UI', sans-serif" font-size="8" fill="#94a3b8">Usecase читает actorID без знания о JWT</text>
  </g>

  <!-- Step 3: Tasks -> Gateway -->
  <line x1="840" y1="380" x2="448" y2="380" stroke="#8b5cf6" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrPurple)" />
  <rect x="550" y="368" width="180" height="15" rx="3" fill="#0f172a" />
  <text x="555" y="379" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#c4b5fd">gRPC CreateTaskResponse</text>

  <!-- Step 4: Gateway -> Mobile -->
  <line x1="440" y1="425" x2="138" y2="425" stroke="#10b981" stroke-width="2" marker-end="url(#arrGreen)" />
  <rect x="180" y="412" width="180" height="16" rx="3" fill="#0f172a" />
  <text x="185" y="424" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#86efac">HTTP 201 Created (JSON)</text>

  <!-- Bottom Benefit Note -->
  <g transform="translate(130, 465)">
    <rect x="0" y="0" width="710" height="26" rx="6" fill="#020617" stroke="#334155" stroke-width="1" />
    <text x="355" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">
      💡 Выгода: 0 CPU-нагрузки на валидацию криптографии внутри кластера, единая точка ротации ключей Ed25519
    </text>
  </g>
</svg>
