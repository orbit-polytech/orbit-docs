<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%">
  <defs>
    <linearGradient id="errBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4" />
    </marker>

    <filter id="shadowBox" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="1016" height="536" rx="16" fill="url(#errBg)" stroke="#313244" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="10" cy="10" r="6" fill="#ef4444" />
    <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#cdd6f4">
      Обработка ошибок • Иерархия, оборачивание (%w) и маппинг в статус-коды gRPC
    </text>
    <line x1="0" y1="28" x2="956" y2="28" stroke="#313244" stroke-width="1" />
  </g>

  <!-- 4 Layer Columns -->

  <!-- Column 1: Domain Core (Left Top) -->
  <g transform="translate(30, 80)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="220" height="200" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.8" />
    <rect x="12" y="10" width="196" height="24" rx="4" fill="#7f1d1d" />
    <text x="110" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fca5a5">
      1. ДОМЕН (domain/)
    </text>

    <rect x="12" y="44" width="196" height="142" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
    <text x="20" y="64" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#f87171">Sentinel Errors:</text>
    <text x="20" y="82" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#fca5a5">• ErrTaskNotFound</text>
    <text x="20" y="98" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#fca5a5">• ErrInvalidDeadline</text>
    <text x="20" y="114" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#fca5a5">• ErrVersionConflict</text>
    <text x="20" y="130" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#fca5a5">• ErrAccessDenied</text>
    <text x="20" y="152" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">Статические errors.New()</text>
    <text x="20" y="168" font-family="'Segoe UI', sans-serif" font-size="8" fill="#64748b">Проверяются через errors.Is</text>
  </g>

  <!-- Column 1 Bottom: Infrastructure Drivers -->
  <g transform="translate(30, 300)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="220" height="200" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.8" />
    <rect x="12" y="10" width="196" height="24" rx="4" fill="#022c22" />
    <text x="110" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#6ee7b7">
      ИНФРАСТРУКТУРА (infra/)
    </text>

    <rect x="12" y="44" width="196" height="142" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="20" y="64" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#34d399">Драйверные сбои:</text>
    <text x="20" y="82" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#a7f3d0">• pgx.ErrNoRows</text>
    <text x="20" y="98" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#a7f3d0">• amqp.ErrClosed</text>
    <text x="20" y="114" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#a7f3d0">• net.OpError (timeout)</text>
    <text x="20" y="140" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#6ee7b7">Трансляция в домен:</text>
    <text x="20" y="156" font-family="'JetBrains Mono', monospace" font-size="8" fill="#86efac">if errors.Is(err, pgx.ErrNoRows)</text>
    <text x="20" y="170" font-family="'JetBrains Mono', monospace" font-size="8" fill="#86efac">  return ErrTaskNotFound</text>
  </g>

  <!-- Arrows to Usecase -->
  <path d="M 250 180 L 292 180" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrAmber)" />
  <text x="272" y="170" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#fcd34d">errors.Is</text>

  <path d="M 250 400 L 292 400" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrAmber)" />
  <text x="272" y="390" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#86efac">fmt.Errorf(%w)</text>

  <!-- Column 2: Application / Usecase -->
  <g transform="translate(300, 80)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="220" height="420" rx="10" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1.8" />
    <rect x="12" y="10" width="196" height="24" rx="4" fill="#0369a1" />
    <text x="110" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#bae6fd">
      2. СЦЕНАРИИ (usecase/)
    </text>

    <rect x="12" y="44" width="196" height="360" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
    <text x="20" y="70" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8">Оборачивание контекста:</text>
    
    <rect x="18" y="85" width="184" height="65" rx="4" fill="#020617" stroke="#334155" stroke-width="1" />
    <text x="24" y="104" font-family="'JetBrains Mono', monospace" font-size="8" fill="#93c5fd">fmt.Errorf(</text>
    <text x="32" y="120" font-family="'JetBrains Mono', monospace" font-size="8" fill="#93c5fd">"get task: %w", err</text>
    <text x="24" y="136" font-family="'JetBrains Mono', monospace" font-size="8" fill="#93c5fd">)</text>

    <text x="20" y="175" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8">Проверка отмены:</text>
    <rect x="18" y="190" width="184" height="80" rx="4" fill="#020617" stroke="#334155" stroke-width="1" />
    <text x="24" y="210" font-family="'JetBrains Mono', monospace" font-size="8" fill="#fcd34d">if ctx.Err() != nil {</text>
    <text x="32" y="228" font-family="'JetBrains Mono', monospace" font-size="8" fill="#fcd34d">  return ctx.Err()</text>
    <text x="24" y="246" font-family="'JetBrains Mono', monospace" font-size="8" fill="#fcd34d">}</text>
    <text x="24" y="260" font-family="'Segoe UI', sans-serif" font-size="7.5" fill="#94a3b8">Таймаут или отмена клиента</text>

    <text x="20" y="300" font-family="'Segoe UI', sans-serif" font-size="9" fill="#e0e7ff">• Сохранение дерева причин</text>
    <text x="20" y="320" font-family="'Segoe UI', sans-serif" font-size="9" fill="#e0e7ff">• Логирование шага выполнения</text>
    <text x="20" y="340" font-family="'Segoe UI', sans-serif" font-size="9" fill="#e0e7ff">• Не генерирует gRPC-статусы</text>
    <text x="20" y="380" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38bdf8">Передаёт err в transport --&gt;</text>
  </g>

  <!-- Arrow Usecase to Transport -->
  <line x1="520" y1="280" x2="558" y2="280" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrPurple)" />

  <!-- Column 3: Transport / mapError -->
  <g transform="translate(565, 80)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="225" height="420" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.8" />
    <rect x="12" y="10" width="201" height="24" rx="4" fill="#312e81" />
    <text x="112" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#c7d2fe">
      3. ТРАНСПОРТ (mapError)
    </text>

    <rect x="12" y="44" width="201" height="360" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
    <text x="20" y="70" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#a5b4fc">Маппинг в статус-коды:</text>

    <rect x="18" y="85" width="189" height="45" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <text x="24" y="102" font-family="'JetBrains Mono', monospace" font-size="8" fill="#93c5fd">ErrTaskNotFound</text>
    <text x="24" y="118" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#60a5fa">-&gt; codes.NotFound (404)</text>

    <rect x="18" y="138" width="189" height="45" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <text x="24" y="155" font-family="'JetBrains Mono', monospace" font-size="8" fill="#fde68a">ErrInvalidDeadline</text>
    <text x="24" y="171" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#fcd34d">-&gt; codes.InvalidArgument (400)</text>

    <rect x="18" y="191" width="189" height="45" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="1" />
    <text x="24" y="208" font-family="'JetBrains Mono', monospace" font-size="8" fill="#fca5a5">ErrVersionConflict</text>
    <text x="24" y="224" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#f87171">-&gt; codes.Aborted (409)</text>

    <rect x="18" y="244" width="189" height="45" rx="4" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" />
    <text x="24" y="261" font-family="'JetBrains Mono', monospace" font-size="8" fill="#c4b5fd">ErrAccessDenied</text>
    <text x="24" y="277" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#a78bfa">-&gt; codes.PermissionDenied (403)</text>

    <!-- Internal masking -->
    <rect x="18" y="297" width="189" height="95" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1" />
    <text x="24" y="315" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#fca5a5">🔒 МАСКИРОВАНИЕ ОШИБОК:</text>
    <text x="24" y="332" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#f87171">default: codes.Internal (500)</text>
    <text x="24" y="350" font-family="'Segoe UI', sans-serif" font-size="8" fill="#cbd5e1">Стек вызовов и детали SQL</text>
    <text x="24" y="365" font-family="'Segoe UI', sans-serif" font-size="8" fill="#cbd5e1">пишутся в лог, клиенту</text>
    <text x="24" y="380" font-family="'Segoe UI', sans-serif" font-size="8" fill="#cbd5e1">отдается безопасный текст</text>
  </g>

  <!-- Arrow Transport to Client -->
  <line x1="790" y1="280" x2="828" y2="280" stroke="#06b6d4" stroke-width="2.5" marker-end="url(#arrCyan)" />

  <!-- Column 4: Client (Right) -->
  <g transform="translate(835, 170)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="150" height="210" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.8" />
    <rect x="12" y="10" width="126" height="24" rx="4" fill="#083344" />
    <text x="75" y="26" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#67e8f9">
      🌐 ВНЕШНИЙ КЛИЕНТ
    </text>

    <text x="16" y="60" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#f1f5f9">Gateway / App</text>
    <text x="16" y="80" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">• Понятный HTTP статус</text>
    <text x="16" y="98" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">• Локализованный текст</text>
    <text x="16" y="116" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">• Безопасность (нет утечек)</text>

    <rect x="12" y="130" width="126" height="65" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="18" y="148" font-family="'JetBrains Mono', monospace" font-size="8" fill="#67e8f9">HTTP 404 Not Found</text>
    <text x="18" y="166" font-family="'JetBrains Mono', monospace" font-size="8" fill="#67e8f9">{ "error": "task not</text>
    <text x="18" y="180" font-family="'JetBrains Mono', monospace" font-size="8" fill="#67e8f9">   found" }</text>
  </g>
</svg>
