<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%">
  <defs>
    <linearGradient id="tplBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrIn" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrDip" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrCore" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>

    <filter id="shadowBox" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="1016" height="536" rx="16" fill="url(#tplBg)" stroke="#313244" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="10" cy="10" r="6" fill="#3b82f6" />
    <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#cdd6f4">
      Go Service Template • Границы слоев и Правило зависимостей (Dependency Rule)
    </text>
    <line x1="0" y1="28" x2="956" y2="28" stroke="#313244" stroke-width="1" />
  </g>

  <!-- ==================== 3 COLUMNS ==================== -->

  <!-- Column 1: External / Infrastructure -->
  <g transform="translate(30, 80)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="300" height="420" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.8" />
    <rect x="12" y="12" width="276" height="28" rx="6" fill="#312e81" />
    <text x="150" y="30" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#c7d2fe">
      ВНЕШНИЙ МИР / ИНФРАСТРУКТУРА
    </text>

    <!-- Node 1: Transport -->
    <rect x="14" y="55" width="272" height="95" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
    <text x="24" y="75" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#818cf8">internal/transport/</text>
    <text x="24" y="93" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#e0e7ff">• gRPC Handlers (taskgrpc/)</text>
    <text x="24" y="110" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">• Мапперы Proto &lt;-&gt; Domain</text>
    <text x="24" y="128" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">• Auth &amp; Recovery Interceptors</text>
    <text x="24" y="142" font-family="'JetBrains Mono', monospace" font-size="8" fill="#a5b4fc">Вызывает сценарии Use Case --&gt;</text>

    <!-- Node 2: Infrastructure Adapters -->
    <rect x="14" y="165" width="272" height="110" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="24" y="185" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34d399">internal/infrastructure/</text>
    <text x="24" y="203" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#e0e7ff">• PostgreSQL репозитории (pgx)</text>
    <text x="24" y="220" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">• Redis кэширование и ключи</text>
    <text x="24" y="238" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">• RabbitMQ Outbox Publisher</text>
    <text x="24" y="258" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#10b981">Реализует порты Use Case (DIP)</text>

    <!-- Node 3: Composition Root -->
    <rect x="14" y="290" width="272" height="110" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
    <text x="24" y="310" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fbbf24">cmd/service-name/main.go</text>
    <text x="24" y="328" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#e0e7ff">• Composition Root (Точка сборки)</text>
    <text x="24" y="346" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">• Чтение .env, логгер, сигналы ОС</text>
    <text x="24" y="364" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">• Связывание графа зависимостей</text>
    <text x="24" y="384" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#fcd34d">Собирает Transport, Infra &amp; UseCase</text>
  </g>

  <!-- Arrows from Column 1 to Column 2 -->
  <line x1="330" y1="140" x2="368" y2="140" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrIn)" />
  <line x1="330" y1="230" x2="368" y2="230" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrDip)" />

  <!-- Column 2: Application Layer (usecase) -->
  <g transform="translate(370, 80)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="310" height="420" rx="12" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.8" />
    <rect x="12" y="12" width="286" height="28" rx="6" fill="#0369a1" />
    <text x="155" y="30" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#bae6fd">
      СЛОЙ ПРИЛОЖЕНИЯ (usecase)
    </text>

    <!-- Scenarios -->
    <rect x="14" y="55" width="282" height="150" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
    <text x="24" y="75" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#38bdf8">Сценарии (Use Cases):</text>
    <text x="24" y="95" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e0f2fe">• CreateTaskUseCase</text>
    <text x="24" y="113" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e0f2fe">• GetTaskUseCase</text>
    <text x="24" y="131" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e0f2fe">• ListTasksUseCase</text>
    <text x="24" y="149" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e0f2fe">• CompleteTaskUseCase</text>
    <text x="24" y="169" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">Координация бизнес-логики и транзакций</text>
    <text x="24" y="187" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">Проверка прав владения actor ID (IDOR)</text>

    <!-- Ports -->
    <rect x="14" y="220" width="282" height="180" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="24" y="242" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#6ee7b7">Выходные порты (Interfaces):</text>
    <text x="24" y="265" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a7f3d0">type TaskSaver interface {</text>
    <text x="36" y="280" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#86efac">Save(ctx, task) error</text>
    <text x="24" y="295" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a7f3d0">}</text>
    <text x="24" y="315" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a7f3d0">type TaskFinder interface {</text>
    <text x="36" y="330" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#86efac">FindByID(ctx, id) (*Task, error)</text>
    <text x="24" y="345" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a7f3d0">}</text>
    <text x="24" y="370" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">Инверсия зависимостей (DIP): usecase</text>
    <text x="24" y="386" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">определяет интерфейсы, infra реализует</text>
  </g>

  <!-- Arrow UseCase -> Domain -->
  <line x1="680" y1="210" x2="718" y2="210" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrCore)" />

  <!-- Column 3: Domain Core (domain) -->
  <g transform="translate(720, 80)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="270" height="420" rx="12" fill="#78350f" stroke="#f59e0b" stroke-width="1.8" />
    <rect x="12" y="12" width="246" height="28" rx="6" fill="#451a03" />
    <text x="135" y="30" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fde68a">
      ДОМЕННОЕ ЯДРО (domain)
    </text>

    <!-- Details -->
    <rect x="14" y="55" width="242" height="135" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
    <text x="24" y="75" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#fde68a">Сущности и Value Objects:</text>
    <text x="24" y="95" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fef08a">• Task (Агрегат)</text>
    <text x="24" y="112" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fef08a">• TaskStatus (State machine)</text>
    <text x="24" y="129" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fef08a">• Priority, Deadline</text>
    <text x="24" y="146" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fef08a">• Version (Optimistic Lock)</text>
    <text x="24" y="168" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">Бизнес-инварианты и методы</text>

    <!-- Sentinel errors -->
    <rect x="14" y="205" width="242" height="100" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
    <text x="24" y="225" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fca5a5">Доменные ошибки:</text>
    <text x="24" y="244" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#f87171">• ErrTaskNotFound</text>
    <text x="24" y="260" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#f87171">• ErrInvalidDeadline</text>
    <text x="24" y="276" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#f87171">• ErrTaskAlreadyCompleted</text>
    <text x="24" y="292" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#f87171">• ErrAccessDenied</text>

    <!-- Purity guarantee -->
    <rect x="14" y="320" width="242" height="80" rx="6" fill="#020617" stroke="#334155" stroke-width="1" />
    <text x="24" y="340" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#10b981">ЧИСТЫЙ GO ($gostd)</text>
    <text x="24" y="358" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">• 0 сторонних зависимостей</text>
    <text x="24" y="374" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">• Нет БД, gRPC, HTTP, JSON тегов</text>
    <text x="24" y="390" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">• Мгновенное юнит-тестирование (0мс)</text>
  </g>
</svg>
