<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="prBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadowPr" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Markers -->
    <marker id="arrPrBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrPrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrPrYellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="976" height="396" rx="16" fill="url(#prBg)" stroke="#313244" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="10" cy="10" r="6" fill="#3b82f6" />
    <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#cdd6f4">
      Orbit AI • Полный жизненный цикл задачи и Pull Request (PR Lifecycle)
    </text>
    <line x1="0" y1="28" x2="916" y2="28" stroke="#313244" stroke-width="1" />
  </g>

  <!-- ==================== FLOWCHART STAGES ==================== -->

  <!-- Stage 1: Branch Creation -->
  <g transform="translate(30, 95)" filter="url(#shadowPr)">
    <rect x="0" y="0" width="135" height="120" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="20" cy="22" r="10" fill="#1e3a8a" />
    <text x="20" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#93c5fd">1</text>
    <text x="36" y="26" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Новая ветка</text>
    <line x1="10" y1="40" x2="125" y2="40" stroke="#334155" stroke-width="1" />
    <text x="12" y="58" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38bdf8">git checkout -b</text>
    <text x="12" y="74" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">feature/...</text>
    <text x="12" y="100" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">от свежего main</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="165" y1="155" x2="190" y2="155" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrPrBlue)" />

  <!-- Stage 2: Clean Code & Tests -->
  <g transform="translate(195, 95)" filter="url(#shadowPr)">
    <rect x="0" y="0" width="135" height="120" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="20" cy="22" r="10" fill="#1e3a8a" />
    <text x="20" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#93c5fd">2</text>
    <text x="36" y="26" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Разработка</text>
    <line x1="10" y1="40" x2="125" y2="40" stroke="#334155" stroke-width="1" />
    <text x="12" y="58" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Clean Architecture</text>
    <text x="12" y="74" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Юнит-тесты</text>
    <text x="12" y="100" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#64748b">go test -race</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="330" y1="155" x2="355" y2="155" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrPrBlue)" />

  <!-- Stage 3: Local Quality Gate -->
  <g transform="translate(360, 95)" filter="url(#shadowPr)">
    <rect x="0" y="0" width="135" height="120" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="20" cy="22" r="10" fill="#1e3a8a" />
    <text x="20" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#93c5fd">3</text>
    <text x="36" y="26" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Самопроверка</text>
    <line x1="10" y1="40" x2="125" y2="40" stroke="#334155" stroke-width="1" />
    <text x="12" y="58" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38bdf8">golangci-lint</text>
    <text x="12" y="74" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38bdf8">buf lint</text>
    <text x="12" y="100" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">Чистый git status</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="495" y1="155" x2="520" y2="155" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrPrBlue)" />

  <!-- Stage 4: Open PR -->
  <g transform="translate(525, 95)" filter="url(#shadowPr)">
    <rect x="0" y="0" width="135" height="120" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="20" cy="22" r="10" fill="#1e3a8a" />
    <text x="20" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#93c5fd">4</text>
    <text x="36" y="26" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Открытие PR</text>
    <line x1="10" y1="40" x2="125" y2="40" stroke="#334155" stroke-width="1" />
    <text x="12" y="58" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38bdf8">git push origin</text>
    <text x="12" y="74" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Шаблон описания</text>
    <text x="12" y="100" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">Closes #issue</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="660" y1="155" x2="685" y2="155" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrPrBlue)" />

  <!-- Stage 5: CI Checks & Review -->
  <g transform="translate(690, 95)" filter="url(#shadowPr)">
    <rect x="0" y="0" width="135" height="120" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="20" cy="22" r="10" fill="#78350f" />
    <text x="20" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fde68a">5</text>
    <text x="36" y="26" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#fde68a">CI &amp; Review</text>
    <line x1="10" y1="40" x2="125" y2="40" stroke="#334155" stroke-width="1" />
    <text x="12" y="58" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fef08a">CI: 5 проверок </text>
    <text x="12" y="74" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Code Review</text>
    <text x="12" y="100" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Аппрув тимлида</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <line x1="825" y1="155" x2="850" y2="155" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrPrGreen)" />

  <!-- Stage 6: Squash & Merge -->
  <g transform="translate(855, 95)" filter="url(#shadowPr)">
    <rect x="0" y="0" width="100" height="120" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="2" />
    <circle cx="20" cy="22" r="10" fill="#166534" />
    <text x="20" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#bbf7d0">6</text>
    <text x="36" y="26" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#86efac">Merge</text>
    <line x1="10" y1="40" x2="90" y2="40" stroke="#166534" stroke-width="1" />
    <text x="10" y="60" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#bbf7d0">Squash &amp;</text>
    <text x="10" y="75" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#bbf7d0">Merge</text>
    <text x="10" y="100" font-family="'JetBrains Mono', monospace" font-size="10" fill="#86efac">В main 🎉</text>
  </g>

  <!-- ==================== FEEDBACK LOOPS ==================== -->

  <!-- Feedback Path: Review Changes Requested -> Step 2 (Back to Code) -->
  <path d="M 757 215 L 757 300 L 262 300 L 262 220" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrPrYellow)" />

  <!-- Label on Loop -->
  <g transform="translate(410, 288)">
    <rect x="0" y="0" width="200" height="24" rx="4" fill="#181825" stroke="#f59e0b" stroke-width="1" />
    <text x="100" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#fde68a">
      Правки по ревью (fixup &amp; push)
    </text>
  </g>

  <!-- Explanatory note banner at bottom -->
  <g transform="translate(30, 340)">
    <rect x="0" y="0" width="920" height="36" rx="6" fill="#1e1e2e" stroke="#313244" stroke-width="1" />
    <text x="18" y="22" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">
      💡 <tspan font-weight="700" fill="#e2e8f0">Золотое правило команды:</tspan> Все изменения попадают в main только через Pull Request после зелёного CI и аппрува рецензента.
    </text>
  </g>
</svg>
