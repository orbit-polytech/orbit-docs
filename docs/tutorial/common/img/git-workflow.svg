<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <defs>
    <!-- Dark card gradient background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Branch gradients -->
    <linearGradient id="mainLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="featureLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowMerge" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrowBranch" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>

    <!-- Shadows -->
    <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="956" height="356" rx="16" fill="url(#cardBg)" stroke="#313244" stroke-width="2" />

  <!-- Header Title -->
  <text x="32" y="42" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="15" font-weight="700" fill="#cdd6f4">
    Orbit AI Git Workflow • Linear History &amp; Short-Lived Feature Branches
  </text>
  <line x1="32" y1="58" x2="928" y2="58" stroke="#313244" stroke-width="1" />

  <!-- Branch Badge: main -->
  <g transform="translate(32, 90)">
    <rect x="0" y="0" width="80" height="28" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="16" cy="14" r="5" fill="#60a5fa" />
    <text x="28" y="19" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#93c5fd">main</text>
  </g>

  <!-- Branch Badge: feature -->
  <g transform="translate(32, 230)">
    <rect x="0" y="0" width="180" height="28" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="16" cy="14" r="5" fill="#fcd34d" />
    <text x="28" y="19" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#fde68a">feature/task-filters</text>
  </g>

  <!-- Main Branch Line -->
  <line x1="120" y1="104" x2="890" y2="104" stroke="url(#mainLine)" stroke-width="4" stroke-linecap="round" />

  <!-- Branch Off curve to feature -->
  <path d="M 230 104 C 270 104, 270 244, 310 244" fill="none" stroke="url(#featureLine)" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBranch)" />

  <!-- Feature Branch Line -->
  <line x1="310" y1="244" x2="740" y2="244" stroke="url(#featureLine)" stroke-width="4" stroke-linecap="round" />

  <!-- Merge Back curve (Squash & Merge) -->
  <path d="M 740 244 C 780 244, 780 104, 820 104" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowMerge)" />

  <!-- ==================== MAIN COMMITS ==================== -->

  <!-- Commit 1: v1.0.0 (Base) -->
  <g transform="translate(230, 104)" filter="url(#nodeShadow)">
    <circle cx="0" cy="0" r="10" fill="#1e1e2e" stroke="#60a5fa" stroke-width="4" />
    <!-- Tag Pill above -->
    <rect x="-35" y="-42" width="70" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="0" y="-26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8">v1.0.0</text>
  </g>

  <!-- Concurrent commit on main: fix(auth): validate token exp -->
  <g transform="translate(530, 104)" filter="url(#nodeShadow)">
    <circle cx="0" cy="0" r="10" fill="#1e1e2e" stroke="#60a5fa" stroke-width="4" />
    <!-- Card above -->
    <rect x="-105" y="-52" width="210" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="-95" y="-30" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#cbd5e1">fix(auth):</text>
    <text x="-25" y="-30" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">validate token exp</text>
  </g>

  <!-- Final Commit on main: Squash & Merge PR #42 -->
  <g transform="translate(830, 104)" filter="url(#nodeShadow)">
    <circle cx="0" cy="0" r="12" fill="#22c55e" stroke="#86efac" stroke-width="4" />
    <!-- Card above -->
    <rect x="-120" y="-56" width="240" height="38" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1.5" />
    <text x="0" y="-38" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#bbf7d0">PR #42 (Squash &amp; Merge)</text>
    <text x="0" y="-24" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#86efac">1 атомарный коммит в main</text>
  </g>

  <!-- ==================== FEATURE COMMITS ==================== -->

  <!-- Feature Commit 1: feat(domain): add task priority filter -->
  <g transform="translate(410, 244)" filter="url(#nodeShadow)">
    <circle cx="0" cy="0" r="10" fill="#1e1e2e" stroke="#fbbf24" stroke-width="4" />
    <!-- Card below -->
    <rect x="-125" y="18" width="250" height="42" rx="6" fill="#292524" stroke="#44403c" stroke-width="1" />
    <text x="-115" y="38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fde68a">feat(domain):</text>
    <text x="-20" y="38" font-family="'Segoe UI', sans-serif" font-size="11" fill="#e7e5e4">add priority filter</text>
    <text x="-115" y="52" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a8a29e">коммит 1 в локальной ветке</text>
  </g>

  <!-- Feature Commit 2: test(domain): unit test filters -->
  <g transform="translate(650, 244)" filter="url(#nodeShadow)">
    <circle cx="0" cy="0" r="10" fill="#1e1e2e" stroke="#fbbf24" stroke-width="4" />
    <!-- Card below -->
    <rect x="-120" y="18" width="240" height="42" rx="6" fill="#292524" stroke="#44403c" stroke-width="1" />
    <text x="-110" y="38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fde68a">test(domain):</text>
    <text x="-20" y="38" font-family="'Segoe UI', sans-serif" font-size="11" fill="#e7e5e4">unit test filters</text>
    <text x="-110" y="52" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a8a29e">коммит 2 в локальной ветке</text>
  </g>

  <!-- Rebase Hint label between main and feature -->
  <g transform="translate(530, 185)">
    <rect x="-90" y="-14" width="180" height="26" rx="13" fill="#181825" stroke="#45475a" stroke-width="1" />
    <text x="0" y="3" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#f38ba8">
      git rebase origin/main
    </text>
  </g>
</svg>
