<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="infraStackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Subgraph Gradients -->
    <linearGradient id="hostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="dockerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="stackShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Markers -->
    <marker id="arrInfraBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrInfraGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrInfraOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f97316" />
    </marker>
    <marker id="arrInfraRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="976" height="516" rx="16" fill="url(#infraStackBg)" stroke="#313244" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="10" cy="10" r="6" fill="#38bdf8" />
    <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#cdd6f4">
      Локальное окружение разработки • Хост разработчика и стек Docker Compose (infra)
    </text>
    <line x1="0" y1="28" x2="916" y2="28" stroke="#313244" stroke-width="1" />
  </g>

  <!-- ==================== HOST ENVIRONMENT CONTAINER ==================== -->
  <g transform="translate(30, 75)">
    <!-- Big Host Container -->
    <rect x="0" y="0" width="920" height="340" rx="12" fill="url(#hostGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="16" y="-12" width="260" height="22" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="24" y="3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#94a3b8">
      ХОСТ РАЗРАБОТЧИКА (Localhost)
    </text>

    <!-- ==================== ROW 1: MICROSERVICES (Local Host) ==================== -->
    <g transform="translate(20, 25)">
      <!-- Zone Label -->
      <text x="0" y="-8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#64748b">
        МИКРОСЕРВИСЫ В РАЗРАБОТКЕ (запуск через go run / uv run):
      </text>

      <!-- Svc 1: gateway-service -->
      <g transform="translate(0, 0)" filter="url(#stackShadow)">
        <rect x="0" y="0" width="270" height="68" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
        <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">🛡️ gateway-service</text>
        <rect x="200" y="10" width="55" height="18" rx="3" fill="#312e81" />
        <text x="208" y="23" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#a5b4fc">:8080</text>
        <text x="14" y="44" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a5b4fc">HTTP / REST шлюз</text>
        <text x="14" y="58" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">Swagger UI &amp; Rate Limit</text>
      </g>

      <!-- Svc 2: tasks-service -->
      <g transform="translate(305, 0)" filter="url(#stackShadow)">
        <rect x="0" y="0" width="270" height="68" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
        <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">📋 tasks-service</text>
        <rect x="200" y="10" width="55" height="18" rx="3" fill="#064e3b" />
        <text x="208" y="23" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#a7f3d0">:50055</text>
        <text x="14" y="44" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#6ee7b7">gRPC • Clean Architecture</text>
        <text x="14" y="58" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">Transactional Outbox</text>
      </g>

      <!-- Svc 3: ai-service -->
      <g transform="translate(610, 0)" filter="url(#stackShadow)">
        <rect x="0" y="0" width="270" height="68" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
        <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">🧠 ai-service</text>
        <rect x="200" y="10" width="55" height="18" rx="3" fill="#3b0764" />
        <text x="208" y="23" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#d8b4fe">:50057</text>
        <text x="14" y="44" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#d8b4fe">Python 3.12 • uv / gRPC</text>
        <text x="14" y="58" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">RAG &amp; Gemini 2.0 Flash</text>
      </g>
    </g>

    <!-- Connectors between Microservices and Docker Containers -->
    <!-- Gateway to Redis -->
    <path d="M 155 93 L 155 140 L 440 140 L 440 180" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrInfraRed)" />
    <!-- Tasks to Postgres -->
    <path d="M 400 93 L 400 130 L 155 130 L 155 180" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrInfraGreen)" />
    <!-- Tasks to RabbitMQ -->
    <path d="M 480 93 L 480 130 L 725 130 L 725 180" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrInfraOrange)" />
    <!-- AI to Postgres -->
    <path d="M 745 93 L 745 120 L 220 120 L 220 180" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrInfraBlue)" />

    <!-- ==================== ROW 2: DOCKER COMPOSE INFRA ==================== -->
    <g transform="translate(20, 180)">
      <!-- Zone Container -->
      <rect x="0" y="0" width="880" height="125" rx="10" fill="url(#dockerGrad)" stroke="#0284c7" stroke-width="1.5" />
      <rect x="14" y="-12" width="310" height="22" rx="4" fill="#082f49" stroke="#38bdf8" stroke-width="1" />
      <text x="22" y="3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#38bdf8">
        КОНТЕЙНЕРЫ DOCKER COMPOSE (репозиторий infra)
      </text>

      <!-- Container 1: PostgreSQL 16 -->
      <g transform="translate(15, 20)" filter="url(#stackShadow)">
        <rect x="0" y="0" width="265" height="85" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" />
        <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8">🐘 PostgreSQL 16 + pgvector</text>
        <rect x="195" y="10" width="55" height="18" rx="3" fill="#0c4a6e" />
        <text x="203" y="23" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#7dd3fc">:5432</text>
        <text x="14" y="44" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Образ: pgvector/pgvector:pg16</text>
        <text x="14" y="60" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Схемы: auth, users, tasks, ai</text>
        <text x="14" y="74" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">Векторный поиск HNSW vector(768)</text>
      </g>

      <!-- Container 2: Redis 7.2 -->
      <g transform="translate(305, 20)" filter="url(#stackShadow)">
        <rect x="0" y="0" width="265" height="85" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
        <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#f87171">⚡ Redis 7.2 Cache</text>
        <rect x="195" y="10" width="55" height="18" rx="3" fill="#7f1d1d" />
        <text x="203" y="23" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fca5a5">:6379</text>
        <text x="14" y="44" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Образ: redis:7.2-alpine</text>
        <text x="14" y="60" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Кэш расписания занятий</text>
        <text x="14" y="74" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">Blacklist отозванных JWT по jti</text>
      </g>

      <!-- Container 3: RabbitMQ 3.13 -->
      <g transform="translate(595, 20)" filter="url(#stackShadow)">
        <rect x="0" y="0" width="270" height="85" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5" />
        <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#fb923c">🐇 RabbitMQ 3.13 AMQP</text>
        <rect x="185" y="10" width="75" height="18" rx="3" fill="#7c2d12" />
        <text x="190" y="23" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#fdba74">:5672/15672</text>
        <text x="14" y="44" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Образ: rabbitmq:3.13-management</text>
        <text x="14" y="60" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Шина событий: orbit.events (topic)</text>
        <text x="14" y="74" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">Web UI панель управления на :15672</text>
      </g>
    </g>
  </g>

  <!-- ==================== FOOTER CHEATSHEET ==================== -->
  <g transform="translate(30, 435)">
    <rect x="0" y="0" width="920" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="18" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">
      Быстрые команды запуска (в папке infra/):
    </text>
    <g transform="translate(18, 32)">
      <rect x="0" y="0" width="190" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">docker compose up -d</text>

      <rect x="210" y="0" width="165" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1" transform="translate(210, 0)">docker compose ps</text>

      <rect x="395" y="0" width="170" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1" transform="translate(395, 0)">docker compose down</text>

      <text x="585" y="16" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8">
        ✓ Данные PostgreSQL и очереди RabbitMQ сохраняются в Docker Volumes
      </text>
    </g>
  </g>
</svg>
