<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bufBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Column Gradients -->
    <linearGradient id="col1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="col2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="col3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="col4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="bufShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Markers -->
    <marker id="arrBufBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrBufGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="1016" height="516" rx="16" fill="url(#bufBg)" stroke="#313244" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="10" cy="10" r="6" fill="#38bdf8" />
    <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#cdd6f4">
      Contract-First Workflow • Buf CLI, валидация и генерация типизированного кода
    </text>
    <line x1="0" y1="28" x2="956" y2="28" stroke="#313244" stroke-width="1" />
  </g>

  <!-- ==================== 4 COLUMNS WORKFLOW ==================== -->

  <!-- Column 1: contracts Repo -->
  <g transform="translate(30, 75)" filter="url(#bufShadow)">
    <rect x="0" y="0" width="215" height="340" rx="12" fill="url(#col1Grad)" stroke="#334155" stroke-width="1.5" />
    <rect x="14" y="-12" width="170" height="22" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="22" y="3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#94a3b8">
      1. contracts (GitHub)
    </text>

    <g transform="translate(15, 25)">
      <!-- Proto File Card -->
      <rect x="0" y="0" width="185" height="95" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#93c5fd">.proto схемы</text>
      <text x="12" y="42" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">proto/orbit/tasks/v1/</text>
      <text x="12" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">task.proto</text>
      <text x="12" y="80" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Protobuf v3 • Google AIP</text>

      <!-- Buf Config Card -->
      <rect x="0" y="110" width="185" height="95" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#93c5fd">Buf конфигурация</text>
      <text x="12" y="42" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">buf.yaml (линтер v2)</text>
      <text x="12" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">buf.gen.yaml (плагины)</text>
      <text x="12" y="80" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Единый источник истины</text>

      <text x="4" y="235" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">
        Все изменения API начинаются строго отсюда
      </text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="245" y1="230" x2="275" y2="230" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrBufBlue)" />

  <!-- Column 2: Buf CI -->
  <g transform="translate(280, 75)" filter="url(#bufShadow)">
    <rect x="0" y="0" width="215" height="340" rx="12" fill="url(#col2Grad)" stroke="#6366f1" stroke-width="1.5" />
    <rect x="14" y="-12" width="165" height="22" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
    <text x="22" y="3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#c7d2fe">
      2. Buf CI Pipeline
    </text>

    <g transform="translate(15, 25)">
      <!-- Check 1: buf lint -->
      <rect x="0" y="0" width="185" height="65" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">buf lint</text>
      <text x="12" y="40" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Стиль имён, нумерация</text>
      <text x="12" y="54" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#a5b4fc">Правила STANDARD / AIP</text>

      <!-- Check 2: buf breaking -->
      <rect x="0" y="75" width="185" height="65" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">buf breaking</text>
      <text x="12" y="40" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Проверка против main</text>
      <text x="12" y="54" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#fca5a5">Защита от ломающих правок</text>

      <!-- Step 3: buf generate -->
      <rect x="0" y="150" width="185" height="65" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">buf generate</text>
      <text x="12" y="40" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Генерация Go, Python,</text>
      <text x="12" y="54" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#a5b4fc">OpenAPI 3.1 спецификации</text>

      <text x="4" y="245" font-family="'Segoe UI', sans-serif" font-size="10" fill="#c7d2fe">
        Блокирует PR при любых ошибках совместимости
      </text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="495" y1="230" x2="525" y2="230" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrBufBlue)" />

  <!-- Column 3: Generated Code -->
  <g transform="translate(530, 75)" filter="url(#bufShadow)">
    <rect x="0" y="0" width="215" height="340" rx="12" fill="url(#col3Grad)" stroke="#0ea5e9" stroke-width="1.5" />
    <rect x="14" y="-12" width="165" height="22" rx="4" fill="#082f49" stroke="#38bdf8" stroke-width="1" />
    <text x="22" y="3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#7dd3fc">
      3. Сгенерированный код
    </text>

    <g transform="translate(15, 25)">
      <!-- Go Stubs -->
      <rect x="0" y="0" width="185" height="65" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">Go Stubs (gen/go)</text>
      <text x="12" y="40" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">protoc-gen-go</text>
      <text x="12" y="54" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#7dd3fc">protoc-gen-go-grpc</text>

      <!-- Python Stubs -->
      <rect x="0" y="75" width="185" height="65" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">Python Wheel (gen/py)</text>
      <text x="12" y="40" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">grpcio-tools</text>
      <text x="12" y="54" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#7dd3fc">Пакет contracts на PyPI/Git</text>

      <!-- OpenAPI -->
      <rect x="0" y="150" width="185" height="65" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">OpenAPI 3.1 Spec</text>
      <text x="12" y="40" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">protoc-gen-openapiv2</text>
      <text x="12" y="54" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#7dd3fc">openapi.json для Gateway</text>

      <text x="4" y="245" font-family="'Segoe UI', sans-serif" font-size="10" fill="#bae6fd">
        Строгая типизация без ручного дублирования
      </text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="745" y1="230" x2="775" y2="230" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrBufGreen)" />

  <!-- Column 4: Consumers -->
  <g transform="translate(780, 75)" filter="url(#bufShadow)">
    <rect x="0" y="0" width="205" height="340" rx="12" fill="url(#col4Grad)" stroke="#10b981" stroke-width="1.5" />
    <rect x="14" y="-12" width="165" height="22" rx="4" fill="#022c22" stroke="#34d399" stroke-width="1" />
    <text x="22" y="3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#6ee7b7">
      4. Потребители
    </text>

    <g transform="translate(15, 25)">
      <!-- Consumer 1 -->
      <rect x="0" y="0" width="175" height="65" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">Go Микросервисы</text>
      <text x="12" y="40" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">tasks-service, schedule</text>
      <text x="12" y="54" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a7f3d0">go get contracts/gen/go</text>

      <!-- Consumer 2 -->
      <rect x="0" y="75" width="175" height="65" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">Python Сервисы</text>
      <text x="12" y="40" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">ai-service, bot-service</text>
      <text x="12" y="54" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a7f3d0">uv add contracts</text>

      <!-- Consumer 3 -->
      <rect x="0" y="150" width="175" height="65" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">Flutter Клиент</text>
      <text x="12" y="40" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">client-mobile (REST)</text>
      <text x="12" y="54" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#a7f3d0">из OpenAPI (ADR-005)</text>

      <text x="4" y="245" font-family="'Segoe UI', sans-serif" font-size="10" fill="#86efac">
        Нулевая рассинхронизация форматов данных
      </text>
    </g>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g transform="translate(30, 435)">
    <rect x="0" y="0" width="955" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="18" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">
      ADR-005: Исключение генерации под Dart в contracts
    </text>
    <text x="18" y="42" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">
      Мобильное приложение общается исключительно с API Gateway по REST/JSON. Dart-клиент генерируется из спецификации OpenAPI, отдаваемой Gateway. Это избавляет от необходимости сборки gRPC-Web на мобильных устройствах.
    </text>
  </g>
</svg>
