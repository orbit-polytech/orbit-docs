<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="topoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Zone Gradients -->
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="meshTopoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="topoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Markers -->
    <marker id="arrRestTopo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrGrpcTopo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
    </marker>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="1016" height="536" rx="16" fill="url(#topoBg)" stroke="#313244" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="10" cy="10" r="6" fill="#38bdf8" />
    <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#cdd6f4">
      Сетевая топология: REST на внешней границе vs gRPC во внутреннем контуре
    </text>
    <line x1="0" y1="28" x2="956" y2="28" stroke="#313244" stroke-width="1" />
  </g>

  <!-- ==================== COLUMN 1: EXTERNAL CLIENTS ==================== -->
  <g transform="translate(35, 75)" filter="url(#topoShadow)">
    <rect x="0" y="0" width="230" height="340" rx="12" fill="url(#clientGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="14" y="-12" width="180" height="22" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="22" y="3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#94a3b8">
      КЛИЕНТЫ (НЕДОВЕРЕННАЯ ЗОНА)
    </text>

    <!-- Client 1 -->
    <g transform="translate(15, 25)">
      <rect x="0" y="0" width="200" height="65" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <text x="12" y="24" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#93c5fd">📱 Mobile App</text>
      <text x="12" y="42" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">Flutter 3.x (iOS/Android)</text>
      <text x="12" y="56" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">Библиотека Dio HTTP</text>
    </g>

    <!-- Client 2 -->
    <g transform="translate(15, 115)">
      <rect x="0" y="0" width="200" height="65" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1" />
      <text x="12" y="24" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#7dd3fc">🤖 Telegram-бот</text>
      <text x="12" y="42" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">Python 3.12 (aiogram 3)</text>
      <text x="12" y="56" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">aiohttp клиент</text>
    </g>

    <!-- Client 3 -->
    <g transform="translate(15, 205)">
      <rect x="0" y="0" width="200" height="65" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1" />
      <text x="12" y="24" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#a5f3fc">🌐 Swagger UI / Web</text>
      <text x="12" y="42" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">Браузер разработчика</text>
      <text x="12" y="56" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">OpenAPI 3.1 тесты</text>
    </g>
  </g>

  <!-- ==================== REST CONNECTORS & BADGES ==================== -->
  <line x1="265" y1="132" x2="390" y2="215" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrRestTopo)" />
  <line x1="265" y1="222" x2="390" y2="245" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrRestTopo)" />
  <line x1="265" y1="312" x2="390" y2="275" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrRestTopo)" />

  <!-- Protocol Pill: REST / JSON -->
  <g transform="translate(280, 160)">
    <rect x="0" y="0" width="105" height="34" rx="6" fill="#0c4a6e" stroke="#0284c7" stroke-width="1" />
    <text x="52" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#bae6fd">REST / JSON</text>
    <text x="52" y="28" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#7dd3fc">JWT Bearer</text>
  </g>

  <!-- ==================== COLUMN 2: PERIMETER GATEWAY ==================== -->
  <g transform="translate(395, 75)" filter="url(#topoShadow)">
    <rect x="0" y="0" width="230" height="340" rx="12" fill="url(#edgeGrad)" stroke="#6366f1" stroke-width="2" />
    <rect x="14" y="-12" width="165" height="22" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
    <text x="22" y="3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#c7d2fe">
      ПЕРИМЕТР (EDGE / DMZ)
    </text>

    <!-- Gateway Card -->
    <g transform="translate(15, 25)">
      <rect x="0" y="0" width="200" height="285" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
      <text x="14" y="26" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">🛡️ gateway-service</text>
      <rect x="140" y="12" width="48" height="18" rx="3" fill="#312e81" />
      <text x="148" y="25" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#a5b4fc">:8080</text>
      
      <line x1="12" y1="42" x2="188" y2="42" stroke="#3730a3" stroke-width="1" />

      <text x="14" y="65" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#a5b4fc">Задачи шлюза:</text>
      <text x="14" y="88" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">1. Проверка Ed25519 подписи</text>
      <text x="14" y="106" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">2. Проверка Blacklist (Redis)</text>
      <text x="14" y="124" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">3. Rate Limit (Token Bucket)</text>
      <text x="14" y="142" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">4. CORS &amp; Header sanitizing</text>
      <text x="14" y="160" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">5. Генерация trace_id</text>

      <rect x="12" y="180" width="176" height="50" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1" />
      <text x="20" y="200" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#ffffff">Инъекция metadata:</text>
      <text x="20" y="218" font-family="'JetBrains Mono', monospace" font-size="9" fill="#86efac">x-user-id = claims.sub</text>

      <text x="14" y="252" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#94a3b8">
        Внешний HTTP/JSON конвертируется в gRPC по HTTP/2
      </text>
    </g>
  </g>

  <!-- ==================== gRPC CONNECTORS & BADGES ==================== -->
  <line x1="625" y1="180" x2="750" y2="125" stroke="#818cf8" stroke-width="2" marker-end="url(#arrGrpcTopo)" />
  <line x1="625" y1="220" x2="750" y2="200" stroke="#818cf8" stroke-width="2" marker-end="url(#arrGrpcTopo)" />
  <line x1="625" y1="260" x2="750" y2="275" stroke="#818cf8" stroke-width="2" marker-end="url(#arrGrpcTopo)" />
  <line x1="625" y1="300" x2="750" y2="350" stroke="#818cf8" stroke-width="2" marker-end="url(#arrGrpcTopo)" />

  <!-- Protocol Pill: gRPC / Protobuf -->
  <g transform="translate(638, 225)">
    <rect x="0" y="0" width="105" height="34" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text x="52" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#c7d2fe">gRPC / HTTP2</text>
    <text x="52" y="28" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#a5b4fc">x-user-id</text>
  </g>

  <!-- ==================== COLUMN 3: INTERNAL TRUSTED MESH ==================== -->
  <g transform="translate(755, 75)" filter="url(#topoShadow)">
    <rect x="0" y="0" width="230" height="340" rx="12" fill="url(#meshTopoGrad)" stroke="#1e3a5f" stroke-width="1.5" />
    <rect x="14" y="-12" width="195" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="22" y="3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#38bdf8">
      ДОВЕРЕННЫЙ КОНТУР (orbit-net)
    </text>

    <!-- Mesh Service 1 -->
    <g transform="translate(15, 20)">
      <rect x="0" y="0" width="200" height="58" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#93c5fd">auth-service</text>
      <text x="12" y="38" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Порт :50051 • Выпуск JWT</text>
      <text x="12" y="50" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">AuthInterceptor валидирует метаданные</text>
    </g>

    <!-- Mesh Service 2 -->
    <g transform="translate(15, 95)">
      <rect x="0" y="0" width="200" height="58" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#6ee7b7">tasks-service</text>
      <text x="12" y="38" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Порт :50055 • Clean Architecture</text>
      <text x="12" y="50" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">Context Propagation: actorID</text>
    </g>

    <!-- Mesh Service 3 -->
    <g transform="translate(15, 170)">
      <rect x="0" y="0" width="200" height="58" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#93c5fd">schedule-service</text>
      <text x="12" y="38" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Порт :50053 • Кэш в Redis</text>
      <text x="12" y="50" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">Парсинг расписания Политеха</text>
    </g>

    <!-- Mesh Service 4 -->
    <g transform="translate(15, 245)">
      <rect x="0" y="0" width="200" height="58" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#d8b4fe">ai-service</text>
      <text x="12" y="38" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Порт :50057 • Python / pgvector</text>
      <text x="12" y="50" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">RAG по регламентам университета</text>
    </g>
  </g>

  <!-- ==================== FOOTER COMPARISON SUMMARY ==================== -->
  <g transform="translate(35, 435)">
    <rect x="0" y="0" width="950" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="20" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">
      Архитектурное обоснование гибридного стека:
    </text>
    <text x="20" y="44" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">
      • <tspan font-weight="700" fill="#bae6fd">REST на периметре:</tspan> максимальная совместимость с мобильными сетями (4G/5G), простая интеграция во Flutter (OpenAPI), поддержка стандартных заголовков.
    </text>
    <text x="20" y="62" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">
      • <tspan font-weight="700" fill="#c7d2fe">gRPC в контуре:</tspan> бинарный Protobuf в 3-5 раз компактнее JSON, мультиплексирование потоков в одном соединении HTTP/2, строгая типизация контрактов.
    </text>
  </g>
</svg>
