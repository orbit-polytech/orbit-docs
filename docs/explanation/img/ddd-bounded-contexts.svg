<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dddBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Context Gradients -->
    <linearGradient id="bcAuthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="bcTasksGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="bcSchedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#082f49" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="bcNavGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.8" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="dddShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Marker -->
    <marker id="arrDdd" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
    </marker>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="1016" height="476" rx="16" fill="url(#dddBg)" stroke="#313244" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="10" cy="10" r="6" fill="#6366f1" />
    <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#cdd6f4">
      DDD • Стратегическое проектирование и Ограниченные Контексты (Bounded Contexts)
    </text>
    <line x1="0" y1="28" x2="956" y2="28" stroke="#313244" stroke-width="1" />
  </g>

  <!-- ==================== 4 BOUNDED CONTEXTS ==================== -->

  <!-- Context 1: Auth -->
  <g transform="translate(35, 75)" filter="url(#dddShadow)">
    <rect x="0" y="0" width="220" height="280" rx="12" fill="url(#bcAuthGrad)" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="12" y="-12" width="195" height="22" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" />
    <text x="20" y="3" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#93c5fd">
      auth-service CONTEXT
    </text>

    <g transform="translate(15, 25)">
      <rect x="0" y="0" width="190" height="48" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">Сущность: Account</text>
      <text x="12" y="36" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#93c5fd">Учетная запись системы</text>

      <text x="4" y="70" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Поля контекста:</text>
      <text x="4" y="88" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">• ID (UUID)</text>
      <text x="4" y="104" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">• TelegramID (int64)</text>
      <text x="4" y="120" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">• Roles (student/admin)</text>
      <text x="4" y="136" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">• RefreshTokenHash</text>

      <rect x="0" y="155" width="190" height="55" rx="6" fill="#181825" stroke="#313244" stroke-width="1" />
      <text x="10" y="22" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#a5b4fc">Ответственность:</text>
      <text x="10" y="38" font-family="'Segoe UI', sans-serif" font-size="9" fill="#cbd5e1">Выпуск Ed25519 JWT,</text>
      <text x="10" y="50" font-family="'Segoe UI', sans-serif" font-size="9" fill="#cbd5e1">сессии, проверка ролей</text>
    </g>
  </g>

  <!-- Context 2: Tasks -->
  <g transform="translate(280, 75)" filter="url(#dddShadow)">
    <rect x="0" y="0" width="220" height="280" rx="12" fill="url(#bcTasksGrad)" stroke="#10b981" stroke-width="1.5" />
    <rect x="12" y="-12" width="195" height="22" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="20" y="3" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#6ee7b7">
      tasks-service CONTEXT
    </text>

    <g transform="translate(15, 25)">
      <rect x="0" y="0" width="190" height="48" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">Актор: OwnerID</text>
      <text x="12" y="36" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#6ee7b7">Владелец учебных задач</text>

      <text x="4" y="70" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Поля контекста:</text>
      <text x="4" y="88" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">• OwnerID (string)</text>
      <text x="4" y="104" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">• TaskID, Title</text>
      <text x="4" y="120" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">• Deadline, Priority</text>
      <text x="4" y="136" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">• Status (New, Done)</text>

      <rect x="0" y="155" width="190" height="55" rx="6" fill="#181825" stroke="#313244" stroke-width="1" />
      <text x="10" y="22" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#86efac">Ответственность:</text>
      <text x="10" y="38" font-family="'Segoe UI', sans-serif" font-size="9" fill="#cbd5e1">Управление дедлайнами,</text>
      <text x="10" y="50" font-family="'Segoe UI', sans-serif" font-size="9" fill="#cbd5e1">Transactional Outbox</text>
    </g>
  </g>

  <!-- Context 3: Schedule -->
  <g transform="translate(525, 75)" filter="url(#dddShadow)">
    <rect x="0" y="0" width="220" height="280" rx="12" fill="url(#bcSchedGrad)" stroke="#0ea5e9" stroke-width="1.5" />
    <rect x="12" y="-12" width="195" height="22" rx="4" fill="#082f49" stroke="#0ea5e9" stroke-width="1" />
    <text x="20" y="3" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#7dd3fc">
      schedule CONTEXT
    </text>

    <g transform="translate(15, 25)">
      <rect x="0" y="0" width="190" height="48" rx="6" fill="#1e293b" stroke="#0ea5e9" stroke-width="1" />
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">Слушатель: Member</text>
      <text x="12" y="36" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#7dd3fc">Студент учебной группы</text>

      <text x="4" y="70" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Поля контекста:</text>
      <text x="4" y="88" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">• GroupID (261-334)</text>
      <text x="4" y="104" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">• Subgroup (1 / 2)</text>
      <text x="4" y="120" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">• DayOfWeek, TimeSlot</text>
      <text x="4" y="136" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">• Subject, Room</text>

      <rect x="0" y="155" width="190" height="55" rx="6" fill="#181825" stroke="#313244" stroke-width="1" />
      <text x="10" y="22" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#bae6fd">Ответственность:</text>
      <text x="10" y="38" font-family="'Segoe UI', sans-serif" font-size="9" fill="#cbd5e1">Парсинг расписания,</text>
      <text x="10" y="50" font-family="'Segoe UI', sans-serif" font-size="9" fill="#cbd5e1">кэш пар в Redis</text>
    </g>
  </g>

  <!-- Context 4: Navigation -->
  <g transform="translate(770, 75)" filter="url(#dddShadow)">
    <rect x="0" y="0" width="215" height="280" rx="12" fill="url(#bcNavGrad)" stroke="#a855f7" stroke-width="1.5" />
    <rect x="12" y="-12" width="190" height="22" rx="4" fill="#3b0764" stroke="#a855f7" stroke-width="1" />
    <text x="20" y="3" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#d8b4fe">
      nav-service CONTEXT
    </text>

    <g transform="translate(15, 25)">
      <rect x="0" y="0" width="185" height="48" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">Посетитель: Visitor</text>
      <text x="12" y="36" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#d8b4fe">Навигатор по кампусу</text>

      <text x="4" y="70" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Поля контекста:</text>
      <text x="4" y="88" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">• Building (БС / АВ / ПР)</text>
      <text x="4" y="104" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">• Floor, RoomID</text>
      <text x="4" y="120" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">• RouteSteps (маршрут)</text>
      <text x="4" y="136" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">• Distance / Time</text>

      <rect x="0" y="155" width="185" height="55" rx="6" fill="#181825" stroke="#313244" stroke-width="1" />
      <text x="10" y="22" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#e9d5ff">Ответственность:</text>
      <text x="10" y="38" font-family="'Segoe UI', sans-serif" font-size="9" fill="#cbd5e1">Построение переходов,</text>
      <text x="10" y="50" font-family="'Segoe UI', sans-serif" font-size="9" fill="#cbd5e1">карты аудиторий вуза</text>
    </g>
  </g>

  <!-- Context propagation link via x-user-id metadata -->
  <path d="M 255 200 L 280 200" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrDdd)" />
  <path d="M 500 200 L 525 200" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrDdd)" />
  <path d="M 745 200 L 770 200" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrDdd)" />

  <!-- Footer Banner -->
  <g transform="translate(35, 380)">
    <rect x="0" y="0" width="950" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="18" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">
      Принцип расщепления понятий в DDD (No God-Object):
    </text>
    <text x="18" y="44" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">
      Вместо единой 2000-строчной таблицы User с десятками разнородных полей каждый сервис оперирует <tspan font-weight="700" fill="#fde68a">собственной специализированной моделью</tspan>.
    </text>
    <text x="18" y="62" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">
      Межсервисный контекст передается строго через неизменяемый идентификатор <tspan font-family="'JetBrains Mono', monospace" fill="#86efac">x-user-id</tspan> в gRPC-метаданных.
    </text>
  </g>
</svg>
