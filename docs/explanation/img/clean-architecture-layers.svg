<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" width="100%" height="100%">
  <defs>
    <!-- Card Gradient -->
    <linearGradient id="caBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Layer Gradients -->
    <linearGradient id="gradL4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="gradL3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="gradL2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#082f49" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="gradL1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.9" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="caShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Markers -->
    <marker id="arrInward" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrDip" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="1016" height="616" rx="16" fill="url(#caBg)" stroke="#313244" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="10" cy="10" r="6" fill="#f59e0b" />
    <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#cdd6f4">
      Clean Architecture • Правило зависимостей и слои микросервиса (Dependency Rule)
    </text>
    <line x1="0" y1="28" x2="956" y2="28" stroke="#313244" stroke-width="1" />
  </g>

  <!-- ==================== CONCENTRIC LAYERS (Left / Center) ==================== -->

  <!-- Layer 4: Transport (Outer) -->
  <g transform="translate(40, 80)" filter="url(#caShadow)">
    <rect x="0" y="0" width="580" height="420" rx="16" fill="url(#gradL4)" stroke="#6366f1" stroke-width="2" />
    <rect x="16" y="12" width="310" height="22" rx="4" fill="#1e1b4b" />
    <text x="24" y="27" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#a5b4fc">
      СЛОЙ 4: Входной транспорт (internal/transport/)
    </text>
    <text x="350" y="27" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#818cf8">
      gRPC Handlers, REST Chi, Interceptors
    </text>

    <!-- Layer 3: Infrastructure (Nested) -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="540" height="345" rx="14" fill="url(#gradL3)" stroke="#10b981" stroke-width="2" />
      <rect x="16" y="12" width="325" height="22" rx="4" fill="#022c22" />
      <text x="24" y="27" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#6ee7b7">
        СЛОЙ 3: Инфраструктура (internal/infrastructure/)
      </text>
      <text x="365" y="27" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#34d399">
        PostgreSQL, Redis, RabbitMQ, IDGen
      </text>

      <!-- Layer 2: Usecase (Nested) -->
      <g transform="translate(20, 50)">
        <rect x="0" y="0" width="500" height="270" rx="12" fill="url(#gradL2)" stroke="#0ea5e9" stroke-width="2" />
        <rect x="16" y="12" width="315" height="22" rx="4" fill="#082f49" />
        <text x="24" y="27" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#7dd3fc">
          СЛОЙ 2: Сценарии &amp; Порты (internal/usecase/)
        </text>
        <text x="355" y="27" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#38bdf8">
          Use Cases, TaskSaver, TaskFinder
        </text>

        <!-- Layer 1: Domain Core (Center) -->
        <g transform="translate(20, 50)">
          <rect x="0" y="0" width="460" height="195" rx="10" fill="url(#gradL1)" stroke="#f59e0b" stroke-width="2.5" />
          <rect x="16" y="12" width="280" height="22" rx="4" fill="#451a03" />
          <text x="24" y="27" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fde68a">
            СЛОЙ 1: Доменное ядро (internal/domain/)
          </text>
          
          <!-- Domain Entities Card -->
          <g transform="translate(16, 45)">
            <rect x="0" y="0" width="200" height="125" rx="6" fill="#292524" stroke="#78350f" stroke-width="1" />
            <text x="12" y="20" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#fef08a">Сущности и Агрегаты</text>
            <text x="12" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">• Task (status, version)</text>
            <text x="12" y="54" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">• Complete(), Reschedule()</text>
            <text x="12" y="74" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#fef08a">Value Objects</text>
            <text x="12" y="92" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">• TaskID, OwnerID, Title</text>
            <text x="12" y="108" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">• Deadline (валидация)</text>
          </g>

          <!-- Domain Invariants & Rules Card -->
          <g transform="translate(230, 45)">
            <rect x="0" y="0" width="215" height="125" rx="6" fill="#292524" stroke="#78350f" stroke-width="1" />
            <text x="12" y="20" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#fef08a">Бизнес-инварианты</text>
            <text x="12" y="38" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e2e8f0">• Защита переходов статуса</text>
            <text x="12" y="54" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e2e8f0">• Проверка авторства (actorID)</text>
            <text x="12" y="74" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#fef08a">Доменные ошибки</text>
            <text x="12" y="92" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#fca5a5">• ErrTaskNotFound</text>
            <text x="12" y="108" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#fca5a5">• ErrVersionConflict</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== DEPENDENCY RULE PANEL (Right) ==================== -->
  <g transform="translate(640, 80)" filter="url(#caShadow)">
    <rect x="0" y="0" width="345" height="420" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    
    <!-- Header -->
    <rect x="16" y="14" width="220" height="22" rx="4" fill="#0f172a" />
    <text x="24" y="29" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f59e0b">
      The Dependency Rule
    </text>

    <!-- Rule Statement Card -->
    <g transform="translate(16, 45)">
      <rect x="0" y="0" width="313" height="70" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
      <text x="12" y="20" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#fef08a">
        Главное правило Роберта Мартина:
      </text>
      <text x="12" y="38" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">
        Исходный код может зависеть ТОЛЬКО от
      </text>
      <text x="12" y="54" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">
        внутренних слоев. Стрелки строго внутрь!
      </text>
    </g>

    <!-- Inward Dependency Flow Arrows -->
    <g transform="translate(16, 125)">
      <!-- Flow Step 4 -->
      <rect x="0" y="0" width="280" height="32" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="10" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#c7d2fe">Transport (gRPC / HTTP)</text>
      <path d="M 290 16 L 310 16 L 310 46 L 290 46" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrInward)" />

      <!-- Flow Step 2 -->
      <rect x="0" y="44" width="280" height="32" rx="4" fill="#082f49" stroke="#0ea5e9" stroke-width="1" />
      <text x="10" y="64" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#bae6fd">Use Cases (Сценарии)</text>
      <path d="M 290 60 L 310 60 L 310 90 L 290 90" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrInward)" />

      <!-- Flow Step 1 -->
      <rect x="0" y="88" width="280" height="32" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
      <text x="10" y="108" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fde68a">Domain (Ядро системы)</text>
    </g>

    <!-- Inversion of Control (DIP) Card -->
    <g transform="translate(16, 260)">
      <rect x="0" y="0" width="313" height="142" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="1" />
      <text x="12" y="20" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">
        Инверсия зависимостей (DIP):
      </text>
      <text x="12" y="38" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">
        Usecase объявляет интерфейсы-порты:
      </text>
      <rect x="12" y="46" width="289" height="24" rx="4" fill="#022c22" />
      <text x="18" y="62" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a7f3d0">
        type TaskSaver interface { Save(...) }
      </text>
      <text x="12" y="86" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">
        Инфраструктура (Postgres) РЕАЛИЗУЕТ порт:
      </text>
      <rect x="12" y="94" width="289" height="24" rx="4" fill="#022c22" />
      <text x="18" y="110" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a7f3d0">
        type TaskRepo struct { pool *pgxpool.Pool }
      </text>
      <text x="12" y="132" font-family="'Segoe UI', sans-serif" font-size="9" fill="#86efac">
        ✓ Бизнес-логика ничего не знает о SQL и базах данных!
      </text>
    </g>
  </g>

  <!-- Bottom Explanatory Banner -->
  <g transform="translate(40, 520)">
    <rect x="0" y="0" width="945" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="18" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">
      Изоляция слоёв на уровне компиляции Go (depguard):
    </text>
    <text x="18" y="44" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">
      • Слой <tspan font-weight="700" fill="#fde68a">internal/domain</tspan> импортирует <tspan font-weight="700" fill="#fde68a">СТРОГО ТОЛЬКО $gostd</tspan> (никакого стороннего кода, ORM, Protobuf или SQL).
    </text>
    <text x="18" y="62" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">
      • Слой <tspan font-weight="700" fill="#bae6fd">internal/usecase</tspan> зависит от domain и стандартной библиотеки. Зависимость от infrastructure запрещена и ломает билд CI.
    </text>
  </g>
</svg>
