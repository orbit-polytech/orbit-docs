<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="adrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Zone Gradients -->
    <linearGradient id="redisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e1e2e" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="rmqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e1e2e" stop-opacity="0.8" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="adrShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="976" height="476" rx="16" fill="url(#adrBg)" stroke="#313244" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="10" cy="10" r="6" fill="#f97316" />
    <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#cdd6f4">
      ADR-006: Разделение архитектурных ролей Redis 7 и RabbitMQ
    </text>
    <line x1="0" y1="28" x2="916" y2="28" stroke="#313244" stroke-width="1" />
  </g>

  <!-- ==================== COLUMN 1: REDIS 7 ==================== -->
  <g transform="translate(35, 75)" filter="url(#adrShadow)">
    <rect x="0" y="0" width="435" height="280" rx="12" fill="url(#redisGrad)" stroke="#ef4444" stroke-width="1.5" />
    
    <!-- Title Badge -->
    <rect x="16" y="14" width="220" height="26" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1" />
    <text x="26" y="32" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#fecaca">
      ⚡ Redis 7 (In-Memory Key-Value)
    </text>
    <text x="250" y="32" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#fca5a5">
      RAM • Латентность &lt; 2 мс
    </text>

    <!-- Capabilities List -->
    <g transform="translate(16, 55)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="403" height="46" rx="6" fill="#181825" stroke="#313244" stroke-width="1" />
      <text x="12" y="20" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#fca5a5">1. Кэширование расписания (Cache-Aside)</text>
      <text x="12" y="36" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Ключи schedule:group:ID с TTL 1 час, fallback на PostgreSQL</text>

      <!-- Item 2 -->
      <rect x="0" y="54" width="403" height="46" rx="6" fill="#181825" stroke="#313244" stroke-width="1" />
      <text x="12" y="74" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#fca5a5">2. Blacklist отозванных токенов</text>
      <text x="12" y="90" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Проверка jti на шлюзе при каждом запросе за 0.5 мс</text>

      <!-- Item 3 -->
      <rect x="0" y="108" width="403" height="46" rx="6" fill="#181825" stroke="#313244" stroke-width="1" />
      <text x="12" y="128" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#fca5a5">3. Ограничение частоты запросов (Rate Limiting)</text>
      <text x="12" y="144" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Счётчики Token Bucket по IP и user_id в памяти</text>

      <!-- Item 4 -->
      <rect x="0" y="162" width="403" height="46" rx="6" fill="#181825" stroke="#313244" stroke-width="1" />
      <text x="12" y="182" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#fca5a5">4. Идемпотентность быстрых операций</text>
      <text x="12" y="198" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Атомарная проверка SET NX EX для защиты от дублей</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: RABBITMQ ==================== -->
  <g transform="translate(510, 75)" filter="url(#adrShadow)">
    <rect x="0" y="0" width="435" height="280" rx="12" fill="url(#rmqGrad)" stroke="#f97316" stroke-width="1.5" />
    
    <!-- Title Badge -->
    <rect x="16" y="14" width="235" height="26" rx="6" fill="#7c2d12" stroke="#f97316" stroke-width="1" />
    <text x="26" y="32" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#fed7aa">
      🐇 RabbitMQ (AMQP 0-9-1 Broker)
    </text>
    <text x="265" y="32" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#fdba74">
      DISK • Гарантия At-Least-Once
    </text>

    <!-- Capabilities List -->
    <g transform="translate(16, 55)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="403" height="46" rx="6" fill="#181825" stroke="#313244" stroke-width="1" />
      <text x="12" y="20" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#fdba74">1. Асинхронные доменные события</text>
      <text x="12" y="36" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Topic Exchange orbit.events с ключами tasks.v1.task.*</text>

      <!-- Item 2 -->
      <rect x="0" y="54" width="403" height="46" rx="6" fill="#181825" stroke="#313244" stroke-width="1" />
      <text x="12" y="74" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#fdba74">2. Очереди фоновых задач</text>
      <text x="12" y="90" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Отправка Push-уведомлений, индексация в ai-service</text>

      <!-- Item 3 -->
      <rect x="0" y="108" width="403" height="46" rx="6" fill="#181825" stroke="#313244" stroke-width="1" />
      <text x="12" y="128" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#fdba74">3. Подтверждения доставки (Ack / Nack)</text>
      <text x="12" y="144" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Сообщения сохраняются на диск до ручного подтверждения</text>

      <!-- Item 4 -->
      <rect x="0" y="162" width="403" height="46" rx="6" fill="#181825" stroke="#313244" stroke-width="1" />
      <text x="12" y="182" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#fdba74">4. Очереди недоставленных (DLX / DLQ)</text>
      <text x="12" y="198" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Изоляция проблемных сообщений после 3 неудачных попыток</text>
    </g>
  </g>

  <!-- ==================== BOTTOM WARNING / ANTI-PATTERNS ==================== -->
  <g transform="translate(35, 375)">
    <rect x="0" y="0" width="910" height="78" rx="8" fill="#111827" stroke="#dc2626" stroke-width="1.5" />
    <text x="18" y="24" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#f87171">
      ❌ СТРОГО ЗАПРЕЩЁННЫЕ АНТИПАТТЕРНЫ:
    </text>
    <text x="18" y="46" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">
      1. <tspan font-weight="700" fill="#fca5a5">Запрещено использовать Redis Pub/Sub для доменных событий:</tspan> при перезапуске сервиса сообщения теряются (Fire-and-Forget).
    </text>
    <text x="18" y="64" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">
      2. <tspan font-weight="700" fill="#fed7aa">Запрещено использовать RabbitMQ как хранилище состояния:</tspan> это FIFO-очередь, она не предназначена для поиска по ключу.
    </text>
  </g>
</svg>
