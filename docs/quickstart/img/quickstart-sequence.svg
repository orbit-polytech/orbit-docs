<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%">
  <defs>
    <linearGradient id="qsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>

    <filter id="shadowBox" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="1016" height="536" rx="16" fill="url(#qsBg)" stroke="#313244" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="10" cy="10" r="6" fill="#06b6d4" />
    <text x="26" y="15" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#cdd6f4">
      Быстрый старт • Сквозной сценарий: Dev-логин и создание задачи через Gateway Swagger
    </text>
    <line x1="0" y1="28" x2="956" y2="28" stroke="#313244" stroke-width="1" />
  </g>

  <!-- Lifelines -->
  <line x1="110" y1="110" x2="110" y2="500" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="330" y1="110" x2="330" y2="500" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="550" y1="110" x2="550" y2="500" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="750" y1="110" x2="750" y2="500" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="920" y1="110" x2="920" y2="500" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Participants -->
  <g transform="translate(30, 68)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="160" height="42" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="80" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#93c5fd">💻 Разработчик</text>
    <text x="80" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#64748b">Swagger UI / curl</text>
  </g>

  <g transform="translate(245, 68)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="170" height="42" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
    <text x="85" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#c7d2fe">🛡️ HTTP Gateway</text>
    <text x="85" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a5b4fc">localhost:8080</text>
  </g>

  <g transform="translate(470, 68)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="160" height="42" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <text x="80" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#67e8f9">🔑 auth-service</text>
    <text x="80" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#22d3ee">gRPC :50051</text>
  </g>

  <g transform="translate(670, 68)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="160" height="42" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="80" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#a7f3d0">⚙️ tasks-service</text>
    <text x="80" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#6ee7b7">gRPC :50055</text>
  </g>

  <g transform="translate(850, 68)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="140" height="42" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.5" />
    <text x="70" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#bbf7d0">🐘 PostgreSQL</text>
    <text x="70" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#86efac">tasks_db :5432</text>
  </g>

  <!-- Flow 1: Dev Login -->
  <line x1="110" y1="140" x2="324" y2="140" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrCyan)" />
  <rect x="120" y="124" width="195" height="16" rx="3" fill="#0f172a" />
  <text x="125" y="135" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#67e8f9">1. POST /v1/auth/dev-login {"id":1001}</text>

  <!-- Gateway to Auth -->
  <line x1="330" y1="165" x2="544" y2="165" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrCyan)" />
  <text x="360" y="160" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#67e8f9">gRPC DevLogin(1001)</text>

  <!-- Auth to Gateway -->
  <line x1="550" y1="190" x2="336" y2="190" stroke="#06b6d4" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrCyan)" />
  <text x="375" y="185" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#a5f3fc">JWT (Ed25519 Token)</text>

  <!-- Gateway to Dev -->
  <line x1="330" y1="215" x2="116" y2="215" stroke="#06b6d4" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrCyan)" />
  <rect x="130" y="202" width="180" height="15" rx="3" fill="#0f172a" />
  <text x="135" y="213" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#67e8f9">access_token: eyJhbGciOiJFZ...</text>

  <!-- Divider / Note -->
  <g transform="translate(100, 245)">
    <rect x="0" y="0" width="820" height="26" rx="5" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" />
    <text x="410" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#e0e7ff">
      🔑 Шаг авторизации: В Swagger нажимаем кнопку «Authorize» и вставляем полученный токен
    </text>
  </g>

  <!-- Flow 2: Create Task -->
  <line x1="110" y1="310" x2="324" y2="310" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrPurple)" />
  <rect x="120" y="294" width="195" height="16" rx="3" fill="#0f172a" />
  <text x="125" y="305" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#c4b5fd">2. POST /v1/tasks [Bearer token]</text>

  <!-- Gateway to Tasks -->
  <line x1="330" y1="345" x2="744" y2="345" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrPurple)" />
  <rect x="420" y="332" width="220" height="15" rx="3" fill="#0f172a" />
  <text x="425" y="343" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#c4b5fd">gRPC CreateTask (x-user-id: 1001)</text>

  <!-- Tasks to DB -->
  <line x1="750" y1="380" x2="914" y2="380" stroke="#10b981" stroke-width="2" marker-end="url(#arrEmerald)" />
  <text x="765" y="374" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#86efac">INSERT INTO tasks</text>

  <!-- DB to Tasks -->
  <line x1="920" y1="410" x2="756" y2="410" stroke="#10b981" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrEmerald)" />
  <text x="805" y="405" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#86efac">Row committed</text>

  <!-- Tasks to Gateway -->
  <line x1="750" y1="440" x2="336" y2="440" stroke="#8b5cf6" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrPurple)" />
  <text x="500" y="434" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#c4b5fd">Task DTO (Protobuf)</text>

  <!-- Gateway to Dev -->
  <line x1="330" y1="475" x2="116" y2="475" stroke="#10b981" stroke-width="2" marker-end="url(#arrEmerald)" />
  <rect x="130" y="462" width="180" height="16" rx="3" fill="#0f172a" />
  <text x="135" y="474" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#86efac">201 Created {id, title, status}</text>
</svg>
